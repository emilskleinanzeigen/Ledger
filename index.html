<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Stock Journal</title>
<meta name="theme-color" content="#08090a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #08090a;
    --panel: #131316;
    --panel-raised: #1b1b1f;
    --line: #2b2b30;
    --line-warm: #38383e;
    --paper: #f2f2f0;
    --muted: #8c8d93;
    --gold: #c9cbd2;
    --silver-hi: #f4f5f7;
    --silver-lo: #9a9ca3;
    --sage: #74ab8e;
    --rust: #c1654f;
    --app-h: 100vh;
  }
  @supports (height:100dvh){ :root{ --app-h: 100dvh; } }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 800px at 90% -10%, rgba(210,213,220,0.05), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(180,183,190,0.035), transparent 55%),
      var(--bg);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    display:grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: var(--app-h);
    height:var(--app-h);
    overflow:hidden;
  }

  /* ---------- SIDEBAR / LEDGER SPINE ---------- */
  .spine{
    background: linear-gradient(180deg, #131315, #08090a);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    height:var(--app-h);
    min-height:0;
    overflow:hidden;
  }
  .spine-head{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .v-logo{
    flex-shrink:0;
    width:36px;
    height:36px;
    border-radius:8px;
    background:linear-gradient(155deg, #1c1c1f, #000);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
  }
  .spine-head .mark{
    font-family:'Fraunces', serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:0.02em;
    line-height:1.15;
  }
  .spine-head .sub{
    margin-top:2px;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* ---------- NAV + LIBRARY TREE ---------- */
  .ic{ display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .nav{ display:flex; flex-direction:column; gap:2px; padding:12px 10px 8px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; width:100%;
    background:transparent; border:1px solid transparent; border-radius:7px;
    color:var(--muted); font-family:'Inter', sans-serif; font-size:13px; font-weight:500;
    padding:9px 12px; cursor:pointer; text-align:left;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .nav-item:hover{ color:var(--paper); background:var(--panel-raised); }
  .nav-item.active{ color:var(--paper); background:var(--panel-raised); border-color:var(--line); }
  .tree{ flex:1; min-height:0; overflow-y:auto; padding:4px 10px 20px; border-top:1px solid var(--line); }
  .tree-label{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); padding:14px 10px 6px; }
  .tree-item{
    display:flex; align-items:center; gap:8px; width:100%;
    background:transparent; border:none; border-radius:6px;
    color:var(--muted); font-family:'Inter', sans-serif; font-size:13px; text-align:left;
    padding:7px 10px; cursor:pointer;
  }
  .tree-item:hover{ background:var(--panel-raised); color:var(--paper); }
  .tree-item.active{ background:var(--panel-raised); color:var(--paper); box-shadow:inset 2px 0 0 var(--gold); }
  .tree-item .t-name{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tree-item .t-count{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--muted); }
  .tree-item .caret{ display:inline-flex; width:14px; opacity:.7; transition:transform .15s ease; }
  .tree-item .caret.open{ transform:rotate(90deg); }
  .tree-children{ padding-left:16px; }
  .tree-empty{ font-size:12px; color:var(--muted); padding:6px 10px; font-style:italic; opacity:.8; }

  /* ---------- MAIN ---------- */
  .main{
    height:var(--app-h);
    min-height:0;
    overflow-y:auto;
    padding:36px 48px 80px;
  }
  .main-empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:14px;
    text-align:center;
    flex-direction:column;
    gap:10px;
  }
  .main-empty .big{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:22px;
    color:var(--paper);
  }

  .crumbs{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .crumb{
    display:inline-flex; align-items:center; gap:4px;
    background:none; border:none; padding:4px 0; cursor:pointer;
    color:var(--muted); font-family:'Inter', sans-serif; font-size:12.5px;
  }
  .crumb:hover{ color:var(--paper); }
  .crumb-sep{ color:var(--line-warm); font-size:12px; }

  .page-header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px 16px;
    border-bottom:1px solid var(--line-warm);
    padding-bottom:16px;
    margin-bottom:26px;
  }
  .page-title-wrap{ min-width:0; flex:1 1 200px; }
  .page-title{
    font-family:'Fraunces', serif;
    font-size:30px;
    font-weight:600;
    line-height:1.15;
    overflow-wrap:anywhere;
  }
  .page-meta{
    margin-top:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:0.04em;
  }
  .page-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .page-action{
    display:inline-flex; align-items:center; gap:6px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:7px;
    padding:8px 12px;
    font-size:12px;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    white-space:nowrap;
  }
  .page-action:hover{ color:var(--paper); border-color:var(--paper); }
  .page-action.danger:hover{ color:var(--rust); border-color:var(--rust); }
  .page-action.primary{
    background:linear-gradient(135deg, var(--silver-hi), var(--gold) 55%, var(--silver-lo));
    color:#101012; border-color:transparent; font-weight:600;
  }
  .page-action.primary:hover{ filter:brightness(1.08); color:#101012; border-color:transparent; }
  .page-action.icon-only{ padding:8px 9px; }

  /* ---------- LIBRARY ---------- */
  .section-label{ font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
  .folder-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:12px; margin-bottom:32px; }
  .folder-card{
    position:relative; display:flex; flex-direction:column; gap:16px;
    padding:16px; border-radius:12px; border:1px solid var(--line);
    background:linear-gradient(160deg, #1a1a1e, #0d0d0f);
    cursor:pointer; color:var(--paper); min-width:0;
    transition:border-color .15s ease, transform .15s ease;
  }
  .folder-card:hover{ border-color:var(--silver-lo); }
  .folder-card:active{ transform:scale(0.985); }
  .folder-icon{
    width:36px; height:36px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel-raised); border:1px solid var(--line); color:var(--gold);
  }
  .f-name{ font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .f-meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); margin-top:4px; }
  .folder-card .more-btn{ position:absolute; top:10px; right:8px; }
  .more-btn{
    width:34px; height:34px; flex-shrink:0; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:var(--muted); cursor:pointer;
  }
  .more-btn:hover{ background:var(--panel-raised); color:var(--paper); }
  .journal-list{ border-top:1px solid var(--line); margin-bottom:32px; }
  .page-header + .journal-list{ border-top:none; margin-top:-10px; }
  .journal-row{
    display:flex; align-items:center; gap:14px;
    padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer;
    transition:background .15s ease;
  }
  .journal-row:hover{ background:rgba(255,255,255,0.018); }
  .j-icon{
    width:34px; height:34px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel); border:1px solid var(--line); color:var(--silver-lo);
  }
  .j-main{ flex:1; min-width:0; }
  .j-name{ font-family:'Fraunces', serif; font-size:16.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .j-meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); margin-top:3px; }
  .j-tickers{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--gold); margin-top:5px; letter-spacing:0.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty-card{
    display:block; width:100%; margin-bottom:32px;
    border:1px dashed var(--line); border-radius:12px; background:transparent;
    padding:22px 18px; text-align:center; color:var(--muted);
    font-family:'Inter', sans-serif; font-size:13px; line-height:1.55;
  }
  button.empty-card{ cursor:pointer; }
  button.empty-card:hover{ border-color:var(--silver-lo); color:var(--paper); }

  /* ---------- SHEETS (menus + dialogs) ---------- */
  .overlay{
    position:fixed; inset:0; z-index:60;
    display:flex; align-items:flex-end; justify-content:center;
    background:rgba(0,0,0,0.62);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    opacity:0; transition:opacity .18s ease;
  }
  .overlay.show{ opacity:1; }
  .overlay.closing{ pointer-events:none; }
  .sheet{
    width:100%; max-width:520px; max-height:82%; overflow-y:auto;
    background:linear-gradient(180deg, #18181b, #0f0f11);
    border:1px solid var(--line); border-bottom:none; border-radius:18px 18px 0 0;
    padding:10px 18px calc(20px + env(safe-area-inset-bottom, 0px));
    transform:translateY(28px); transition:transform .22s ease;
    box-shadow:0 -20px 60px rgba(0,0,0,0.5);
  }
  .overlay.show .sheet{ transform:translateY(0); }
  .sheet-grip{ width:38px; height:4px; border-radius:2px; background:var(--line-warm); margin:2px auto 16px; }
  .sheet-title{ font-family:'Fraunces', serif; font-size:19px; font-weight:600; line-height:1.25; overflow-wrap:anywhere; }
  .sheet-msg{ font-size:13px; color:var(--muted); line-height:1.5; margin-top:6px; }
  .sheet-input{
    width:100%; margin-top:14px;
    background:var(--bg); border:1px solid var(--line); border-radius:9px;
    color:var(--paper); font-family:'Inter', sans-serif; font-size:16px;
    padding:12px 13px; outline:none;
  }
  .sheet-input:focus{ border-color:var(--gold); }
  .sheet-actions{ display:flex; gap:10px; margin-top:18px; }
  .sheet-actions .btn{ flex:1; padding:12px 14px; font-size:13.5px; border-radius:9px; }
  .btn.danger{ background:rgba(193,101,79,0.14); color:var(--rust); border-color:rgba(193,101,79,0.5); font-weight:600; }
  .btn.danger:hover{ color:#e58a74; border-color:var(--rust); }
  .sheet-list{ display:flex; flex-direction:column; margin-top:10px; }
  .sheet-item{
    display:flex; align-items:center; gap:12px; width:100%;
    background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--paper); font-family:'Inter', sans-serif; font-size:14.5px; text-align:left;
    padding:14px 4px; cursor:pointer;
  }
  .sheet-item:last-child{ border-bottom:none; }
  .sheet-item .ic{ color:var(--silver-lo); }
  .sheet-item:hover .ic{ color:var(--paper); }
  .sheet-item.danger, .sheet-item.danger .ic{ color:var(--rust); }
  .sheet-item.current{ opacity:0.4; pointer-events:none; }
  .sheet-item .s-label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sheet-item .s-sub{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); flex-shrink:0; }
  .sheet-group{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); padding:16px 4px 2px; }
  #toast.ok{ border-color:var(--line-warm); }

  /* ---------- COMPARE ---------- */
  .cmp-slots{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:10px; align-items:center; margin-bottom:20px; }
  .cmp-slot{
    display:block; width:100%; min-width:0; text-align:left; cursor:pointer;
    padding:14px 15px; border-radius:12px; border:1px solid var(--line);
    background:linear-gradient(160deg, #1a1a1e, #0d0d0f);
    color:var(--paper); font-family:'Inter', sans-serif;
  }
  .cmp-slot:hover{ border-color:var(--silver-lo); }
  .cmp-slot .s-tag{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); font-weight:600; }
  .cmp-slot .s-name{ font-family:'Fraunces', serif; font-size:16.5px; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cmp-slot .s-meta{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--muted); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cmp-slot.empty .s-name{ color:var(--muted); font-style:italic; }
  .cmp-swap{
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel-raised); border:1px solid var(--line); color:var(--paper); cursor:pointer;
  }
  .cmp-swap:hover{ border-color:var(--silver-lo); }
  .cmp-summary{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .pill{ font-family:'IBM Plex Mono', monospace; font-size:11px; padding:6px 11px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--muted); }
  .pill b{ color:var(--paper); font-weight:600; }
  .pill.up b{ color:var(--sage); }
  .pill.down b{ color:var(--rust); }
  .seg{
    display:flex; gap:4px; padding:4px; margin-bottom:18px;
    border:1px solid var(--line); border-radius:11px; background:var(--panel);
    overflow-x:auto; scrollbar-width:none;
  }
  .seg::-webkit-scrollbar{ display:none; }
  .seg button{
    flex:1 0 auto; background:transparent; border:none; border-radius:8px;
    color:var(--muted); font-family:'Inter', sans-serif; font-size:12.5px; font-weight:500;
    padding:8px 12px; cursor:pointer; white-space:nowrap;
  }
  .seg button:hover{ color:var(--paper); }
  .seg button.on{ background:linear-gradient(135deg, var(--silver-hi), var(--gold) 55%, var(--silver-lo)); color:#101012; font-weight:600; }
  .cmp-card{ border:1px solid var(--line); border-radius:12px; background:var(--panel); margin-bottom:14px; overflow:hidden; }
  .cmp-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 16px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
  }
  .cmp-ticker{ font-family:'Fraunces', serif; font-size:18px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .cmp-close{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--muted); text-align:right; white-space:nowrap; }
  .cmp-close .chg{ display:block; font-size:12.5px; font-weight:600; margin-top:2px; }
  .up{ color:var(--sage); }
  .down{ color:var(--rust); }
  .flat{ color:var(--muted); }
  .cmp-scroll{ overflow-x:auto; }
  .cmp-table{ width:100%; border-collapse:collapse; font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .cmp-table th{
    font-family:'Inter', sans-serif; font-size:10px; font-weight:500;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--muted);
    text-align:right; padding:10px 16px 6px;
  }
  .cmp-table td{ text-align:right; padding:8px 16px; border-top:1px solid rgba(255,255,255,0.045); color:var(--paper); white-space:nowrap; vertical-align:top; }
  .cmp-table th:first-child, .cmp-table td:first-child{ text-align:left; color:var(--muted); }
  .cmp-table td.up{ color:var(--sage); }
  .cmp-table td.down{ color:var(--rust); }
  .cmp-table td.flat{ color:var(--muted); }
  .cmp-table .d-sub{ display:block; font-size:10px; opacity:0.85; margin-top:1px; }
  .cmp-table .st{ font-size:10px; margin-left:4px; }
  .cmp-table tr.flip td{ background:rgba(201,203,210,0.06); }
  .cmp-table tr.flip td:first-child{ color:var(--paper); }
  .sig-list{ display:flex; flex-direction:column; gap:10px; padding:14px 16px; }
  .sig{ display:flex; align-items:center; gap:10px; font-size:13px; line-height:1.4; }
  .sig .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .sig.bull .dot{ background:var(--sage); box-shadow:0 0 0 3px rgba(116,171,142,0.16); }
  .sig.bear .dot{ background:var(--rust); box-shadow:0 0 0 3px rgba(193,101,79,0.16); }
  .sig.warn .dot{ background:var(--gold); box-shadow:0 0 0 3px rgba(201,203,210,0.14); }
  .sig-none{ padding:14px 16px; color:var(--muted); font-size:12.5px; }
  .only-note{ font-size:12px; color:var(--muted); line-height:1.7; margin-top:6px; }
  .only-note b{ color:var(--paper); font-weight:500; font-family:'IBM Plex Mono', monospace; }

  #toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%, 20px);
    max-width:calc(100% - 32px);
    background:var(--panel-raised);
    border:1px solid var(--rust);
    color:var(--paper);
    font-size:12.5px;
    padding:10px 14px;
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:50;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  .head-actions{ display:flex; gap:8px; margin-top:16px; }
  .head-btn{
    flex:1;
    background:var(--panel-raised);
    border:1px solid var(--line);
    color:var(--paper);
    font-size:11px;
    padding:9px 6px;
    border-radius:3px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    white-space:nowrap;
  }
  .head-btn:hover{ border-color:var(--gold); }
  #installBtn{ display:none; }

  .add-stock-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    background:linear-gradient(135deg, var(--silver-hi), var(--gold) 55%, var(--silver-lo));
    color:#101012;
    font-weight:600;
    font-size:13px;
    border-radius:3px;
    cursor:pointer;
    border:none;
    letter-spacing:0.02em;
    margin-bottom:26px;
    transition:filter .15s ease;
  }
  .add-stock-btn:hover{ filter:brightness(1.08); }

  /* ---------- ENTRY FORM ---------- */
  .entry-form{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:22px 24px;
    margin-bottom:24px;
  }
  .entry-form .row1{
    margin-bottom:16px;
  }
  .entry-form input[type="text"]{
    width:100%;
    max-width:280px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--paper);
    font-family:'Fraunces', serif;
    font-size:19px;
    padding:6px 2px;
    outline:none;
  }
  .entry-form input[type="text"]:focus{ border-color:var(--gold); }
  .entry-form input[type="text"]::placeholder{ color:var(--muted); font-style:italic; }

  .name-row{ display:flex; align-items:center; gap:10px; }
  .name-row input[type="text"]{ flex:1; min-width:0; }
  .autofill-btn{
    flex-shrink:0;
    padding:9px 13px;
    border-radius:3px;
    border:1px solid var(--line);
    background:var(--panel-raised);
    color:var(--paper);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    white-space:nowrap;
  }

  /* ---------- RUBBERBAND MODEL ---------- */

    padding:24px; text-align:center; cursor:pointer;

      radial-gradient(640px 440px at 50% 44%, rgba(214,217,224,0.085), transparent 66%),
      radial-gradient(1200px 800px at 90% -10%, rgba(210,213,220,0.05), transparent 60%),

  .greet-hello{

    font-size:clamp(46px, 14vw, 88px); line-height:1.04; letter-spacing:-0.01em;
    background:linear-gradient(180deg, #ffffff 0%, #e4e5e9 48%, #9a9ca3 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    opacity:0; transform:translateY(14px); filter:blur(6px);

  }
  .greet-line{
    width:0; height:1px; margin:24px auto 22px;
    background:linear-gradient(90deg, transparent, var(--silver-lo), transparent);

  .greet-sub{
    font-family:'Inter', sans-serif; font-size:12.5px; font-weight:500;
    letter-spacing:0.34em; padding-left:0.34em; text-transform:uppercase;
    color:var(--silver-lo);
    opacity:0; transform:translateY(8px);
    animation:greetIn .8s cubic-bezier(.2,.7,.2,1) .95s forwards;
  }
  @keyframes greetIn{ to{ opacity:1; transform:none; filter:none; } }
  @keyframes greetLine{ to{ width:min(180px, 42vw); } }
  @keyframes greetOut{ to{ opacity:0; visibility:hidden; transform:scale(1.03); } }
  @media (prefers-reduced-motion: reduce){
    .greet-hello, .greet-sub{ animation:none; opacity:1; transform:none; filter:none; }
    .greet-line{ animation:none; width:min(180px, 42vw); }
    #greet{ animation:greetOut .3s ease 1.6s forwards; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
(function(){
  const PAGES_KEY = 'stock-journal-pages';          // journals (key kept so existing data loads)
  const FOLDERS_KEY = 'stock-journal-folders';
  const LAST_VIEW_KEY = 'stock-journal-last-view';
  const entriesKey = (pageId) => `stock-journal-entries:${pageId}`;
  const EMA_PERIODS = [20, 50, 100, 150, 200, 400];

  let pages = [];            // journals: { id, name, createdAt, folderId }
  let folders = [];          // { id, name, createdAt }
  let activePageId = null;
  let entriesCache = {};     // journalId -> entries (newest first)
  let formOpen = false;
  let view = { type:'library' };
  let compareTab = 'signals';
  let lastCompare = { a:null, b:null };
  const expandedFolders = new Set();

  const navEl = document.getElementById('nav');
  const treeEl = document.getElementById('tree');
  const mainEl = document.getElementById('main');

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  /* ---------- ON-DEVICE STORAGE ---------- */
  let saveWarned = false;
  function showToast(msg, kind){
    const t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.toggle('ok', kind === 'ok');
    t.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(()=> t.classList.remove('show'), 4000);
  }
  const store = {
    get(key){
      try{ return localStorage.getItem(key); }catch(e){ return null; }
    },
    set(key, value){
      try{ localStorage.setItem(key, value); return true; }
      catch(e){
        console.error('Save failed', e);
        if(!saveWarned){ saveWarned = true; showToast('Couldn\'t save on this device. Check that the browser allows site storage.'); }
        return false;
      }
    },
    del(key){
      try{ localStorage.removeItem(key); }catch(e){}
    }
  };

  async function loadPages(){
    try{
      const raw = store.get(PAGES_KEY);
      pages = raw ? JSON.parse(raw) : [];
    }catch(e){
      pages = [];
    }
  }

  async function savePages(){
    store.set(PAGES_KEY, JSON.stringify(pages));
  }

  async function loadEntries(pageId){
    if(entriesCache[pageId]) return entriesCache[pageId];
    try{
      const raw = store.get(entriesKey(pageId));
      const val = raw ? JSON.parse(raw) : [];
      entriesCache[pageId] = val;
      return val;
    }catch(e){
      entriesCache[pageId] = [];
      return [];
    }
  }

  async function saveEntries(pageId, entries){
    entriesCache[pageId] = entries;
    store.set(entriesKey(pageId), JSON.stringify(entries));
  }

  function fmtDate(ts){
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }

  function fmtVolume(v){
    if(v === null || v === undefined) return '—';
    if(v >= 1e9) return (v/1e9).toFixed(2).replace(/\.00$/,'') + 'B';
    if(v >= 1e6) return (v/1e6).toFixed(2).replace(/\.00$/,'') + 'M';
    if(v >= 1e3) return (v/1e3).toFixed(1).replace(/\.0$/,'') + 'K';
    return String(v);
  }

  function rsiClass(val){
    if(val === null || val === undefined || val === '') return 'neu';
    if(val >= 70) return 'neg';
    if(val <= 30) return 'pos';
    return 'neu';
  }

  function macdClass(macd, signal){
    if(macd === null || macd === undefined || macd === '' || signal === null || signal === undefined || signal === '') return 'neu';
    return macd >= signal ? 'pos' : 'neg';
  }

  function overallSignalColor(entry){
    // combine daily + weekly RSI extremes for a quick-glance dot
    const vals = [entry.daily.rsi, entry.weekly.rsi].filter(v => v !== null && v !== undefined && v !== '');
    if(vals.some(v => v >= 70)) return 'var(--rust)';
    if(vals.some(v => v <= 30)) return 'var(--sage)';
    return 'var(--muted)';
  }

  /* ---------- DOM HELPERS ---------- */
  const ICON = {
    library: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="4" height="16" rx="1"/><rect x="9" y="4" width="4" height="16" rx="1"/><path d="M15.5 5.2l3.4-.9 3 11.6-3.4.9z"/></svg>',
    compare: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3L4 7l4 4"/><path d="M4 7h13"/><path d="M16 21l4-4-4-4"/><path d="M20 17H7"/></svg>',
    folder: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>',
    journal: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3H18a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 1 4 18.5v-13A2.5 2.5 0 0 1 6.5 3z"/><path d="M8.5 8h6.5M8.5 12h6.5M8.5 16h4"/></svg>',
    more: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
    back: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    caret: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    plus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    edit: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
    move: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M9.5 13.5h6M13 11l2.5 2.5L13 16"/></svg>',
    trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>',
    bolt: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2.5L4.5 13.5H11l-1 8 8.5-11H12z"/></svg>',
    clip: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.9-8.9a3.4 3.4 0 0 1 4.8 4.8l-8.9 8.9a1.7 1.7 0 0 1-2.4-2.4l8.2-8.2"/></svg>',
    download: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>',
    copy: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>',
    share: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 12v6.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V12"/></svg>',
    band: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5v14M21 5v14"/><path d="M3 12c3-5.5 6-5.5 9 0s6 5.5 9 0"/></svg>',
    file: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  };

  // Build DOM without innerHTML for anything the user typed
  function el(tag, props, ...kids){
    const n = document.createElement(tag);
    if(props){
      for(const [k, v] of Object.entries(props)){
        if(v === null || v === undefined || v === false) continue;
        if(k === 'class') n.className = v;
        else if(k === 'text') n.textContent = v;
        else if(k === 'html') n.innerHTML = v;              // static icon markup only
        else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v === true ? '' : v);
      }
    }
    for(const kid of kids.flat()){
      if(kid === null || kid === undefined || kid === false) continue;
      n.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    }
    return n;
  }
  function icon(name){ return el('span', { class:'ic', html: ICON[name] }); }
  function plural(n, one, many){ return `${n} ${n === 1 ? one : many}`; }
  function uniqueName(base, taken){
    const used = new Set(taken.map(s => s.toLowerCase()));
    if(!used.has(base.toLowerCase())) return base;
    let i = 2;
    while(used.has(`${base} (${i})`.toLowerCase())) i++;
    return `${base} (${i})`;
  }
  function slugify(s){ return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'journal'; }
  function activateOnEnter(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.currentTarget.click(); } }

  /* ---------- SHEETS: menus, prompts, confirmations ---------- */
  let closeOpenSheet = null;
  function openSheet(build){
    if(closeOpenSheet) closeOpenSheet(null);
    return new Promise(resolve => {
      const overlay = el('div', { class:'overlay' });
      const sheet = el('div', { class:'sheet', role:'dialog', 'aria-modal':'true' });
      let done = false;
      function close(value){
        if(done) return;
        done = true;
        closeOpenSheet = null;
        document.removeEventListener('keydown', onKey);
        overlay.classList.remove('show');
        overlay.classList.add('closing');          // fading sheets ignore taps
        setTimeout(()=> overlay.remove(), 200);
        resolve(value === undefined ? null : value);
      }
      function onKey(e){ if(e.key === 'Escape') close(null); }
      overlay.addEventListener('click', e => { if(e.target === overlay) close(null); });
      document.addEventListener('keydown', onKey);
      sheet.appendChild(el('div', { class:'sheet-grip' }));
      sheet.appendChild(build(close));
      overlay.appendChild(sheet);
      document.body.appendChild(overlay);
      closeOpenSheet = close;
      requestAnimationFrame(()=> overlay.classList.add('show'));
    });
  }

  function uiPrompt(title, value, opts = {}){
    return openSheet(close => {
      const input = el('input', { class:'sheet-input', type:'text', maxlength:'80', autocomplete:'off', placeholder: opts.placeholder || '' });
      input.value = value || '';
      input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); close(input.value.trim()); } });
      setTimeout(()=>{ try{ input.focus(); input.select(); }catch(e){} }, 80);
      return el('div', null,
        el('div', { class:'sheet-title', text:title }),
        opts.message ? el('div', { class:'sheet-msg', text:opts.message }) : null,
        input,
        el('div', { class:'sheet-actions' },
          el('button', { class:'btn', type:'button', text:'Cancel', onclick: ()=> close(null) }),
          el('button', { class:'btn primary', type:'button', 'data-role':'confirm', text: opts.confirm || 'Save', onclick: ()=> close(input.value.trim()) })));
    });
  }

  function uiConfirm(title, message, confirmLabel, danger = true){
    return openSheet(close => el('div', null,
      el('div', { class:'sheet-title', text:title }),
      message ? el('div', { class:'sheet-msg', text:message }) : null,
      el('div', { class:'sheet-actions' },
        el('button', { class:'btn', type:'button', text:'Cancel', onclick: ()=> close(false) }),
        el('button', { class:'btn ' + (danger ? 'danger' : 'primary'), type:'button', 'data-role':'confirm', text: confirmLabel || 'Delete', onclick: ()=> close(true) }))
    )).then(v => v === true);
  }

  function uiMenu(title, items, message){
    return openSheet(close => el('div', null,
      el('div', { class:'sheet-title', text:title }),
      message ? el('div', { class:'sheet-msg', text:message }) : null,
      el('div', { class:'sheet-list' }, items.map(it =>
        el('button', { class:'sheet-item' + (it.danger ? ' danger' : '') + (it.current ? ' current' : ''), type:'button', 'data-value': it.value, onclick: ()=> close(it.value) },
          it.icon ? icon(it.icon) : null,
          el('span', { class:'s-label', text: it.label }),
          it.sub ? el('span', { class:'s-sub', text: it.sub }) : null)))));
  }

  function uiPickJournal(title, disabledId){
    return openSheet(close => {
      const list = el('div', { class:'sheet-list' });
      const groups = sortedFolders().map(f => ({ label:f.name, items: journalsIn(f.id) }));
      groups.push({ label: folders.length ? 'Not in a folder' : 'Journals', items: journalsIn(null) });
      let any = false;
      groups.forEach(g => {
        if(!g.items.length) return;
        list.appendChild(el('div', { class:'sheet-group', text:g.label }));
        g.items.forEach(p => {
          any = true;
          list.appendChild(el('button', { class:'sheet-item' + (p.id === disabledId ? ' current' : ''), type:'button', 'data-value': p.id, onclick: ()=> close(p.id) },
            icon('journal'), el('span', { class:'s-label', text:p.name }), el('span', { class:'s-sub', text: plural(entryCount(p.id), 'stock', 'stocks') })));
        });
      });
      return el('div', null, el('div', { class:'sheet-title', text:title }), any ? list : el('div', { class:'sheet-msg', text:'No journals yet.' }));
    });
  }

  function uiPickFolder(title, currentFolderId){
    return uiMenu(title, [
      { label:'No folder (Library)', value:'__root', icon:'library', current: !currentFolderId },
      ...sortedFolders().map(f => ({ label:f.name, value:f.id, icon:'folder', sub: plural(journalsIn(f.id).length, 'journal', 'journals'), current: f.id === currentFolderId })),
      { label:'New folder…', value:'__new', icon:'plus' },
    ]);
  }

  /* ---------- LIBRARY DATA ---------- */
  function loadFolders(){
    try{ const raw = store.get(FOLDERS_KEY); folders = raw ? JSON.parse(raw) : []; }
    catch(e){ folders = []; }
  }
  function saveFolders(){ store.set(FOLDERS_KEY, JSON.stringify(folders)); }
  function folderById(id){ return folders.find(f => f.id === id) || null; }
  function pageById(id){ return pages.find(p => p.id === id) || null; }
  function sortedFolders(){ return [...folders].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric:true, sensitivity:'base' })); }
  function journalsIn(folderId){
    return pages.filter(p => (p.folderId || null) === (folderId || null)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  }
  function entryCount(id){ return (entriesCache[id] || []).length; }

  /* ---------- FILE ATTACHMENTS (stored in IndexedDB: plenty of room for PDFs) ---------- */
  const FILES_DB = 'ledger-files';
  const MAX_FILE = 100 * 1024 * 1024;
  let filesDbPromise = null;
  let fileMeta = [];                 // { id, journalId, name, type, size, addedAt }
  const thumbCache = new Map();      // fileId -> object URL for image previews

  function filesDb(){
    if(!filesDbPromise){
      filesDbPromise = new Promise((resolve, reject) => {
        if(!('indexedDB' in window) || !window.indexedDB){ reject(new Error('This browser can’t store files.')); return; }
        const req = indexedDB.open(FILES_DB, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath:'id' });
          if(!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('Could not open file storage.'));
      });
      filesDbPromise.catch(()=>{ filesDbPromise = null; });
    }
    return filesDbPromise;
  }
  function reqP(req){ return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
  function txDone(tx){ return new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('Saving was cancelled.')); }); }

  async function loadFileMeta(){
    try{ const db = await filesDb(); fileMeta = await reqP(db.transaction('meta').objectStore('meta').getAll()); }
    catch(e){ fileMeta = []; }
  }
  function filesOf(journalId){ return fileMeta.filter(m => m.journalId === journalId).sort((a, b) => b.addedAt - a.addedAt); }
  async function addFiles(journalId, list){
    const db = await filesDb();
    const added = [];
    for(const f of list){
      const meta = { id: uid(), journalId, name: f.name || 'file', type: f.type || '', size: f.size || 0, addedAt: Date.now() };
      const tx = db.transaction(['meta', 'blobs'], 'readwrite');
      tx.objectStore('blobs').put(f, meta.id);
      tx.objectStore('meta').put(meta);
      await txDone(tx);
      fileMeta.push(meta);
      added.push(meta);
    }
    return added;
  }
  async function getFileBlob(id){ const db = await filesDb(); return reqP(db.transaction('blobs').objectStore('blobs').get(id)); }
  async function deleteFileIds(ids){
    if(!ids.length) return;
    const db = await filesDb();
    const tx = db.transaction(['meta', 'blobs'], 'readwrite');
    ids.forEach(id => { tx.objectStore('meta').delete(id); tx.objectStore('blobs').delete(id); });
    await txDone(tx);
    const gone = new Set(ids);
    fileMeta = fileMeta.filter(m => !gone.has(m.id));
    ids.forEach(id => { if(thumbCache.has(id)){ URL.revokeObjectURL(thumbCache.get(id)); thumbCache.delete(id); } });
  }
  function removeFilesOf(journalIds){
    const ids = fileMeta.filter(m => journalIds.includes(m.journalId)).map(m => m.id);
    if(ids.length) deleteFileIds(ids).catch(e => console.error('Removing files failed', e));
  }
  async function renameFileMeta(m, name){
    const db = await filesDb();
    const tx = db.transaction('meta', 'readwrite');
    m.name = name;
    tx.objectStore('meta').put(m);
    await txDone(tx);
  }
  function fmtBytes(n){
    if(!isFinite(n)) return '';
    if(n < 1024) return n + ' B';
    if(n < 1048576) return Math.round(n / 1024) + ' KB';
    return (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + ' MB';
  }
  function downloadBlob(blob, name){
    const url = URL.createObjectURL(blob);
    const a = el('a', { href:url, download:name });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 15000);
  }
  async function typedBlob(m){
    const blob = await getFileBlob(m.id);
    if(!blob) throw new Error('This file couldn’t be found on this device.');
    return blob.type ? blob : new Blob([blob], { type: m.type || 'application/octet-stream' });
  }
  async function openFile(m){
    try{
      const blob = await typedBlob(m);
      const url = URL.createObjectURL(blob);
      const win = window.open(url, '_blank');
      if(!win) downloadBlob(blob, m.name);
      setTimeout(()=> URL.revokeObjectURL(url), 60000);
    }catch(e){ showToast('Couldn’t open the file: ' + (e.message || 'unknown error')); }
  }
  async function fileMenu(m){
    const canShare = !!(navigator.share && navigator.canShare);
    const v = await uiMenu(m.name, [
      { label:'Open', value:'open', icon:'file' },
      { label:'Download', value:'download', icon:'download' },
      canShare ? { label:'Share / open with…', value:'share', icon:'share' } : null,
      { label:'Rename', value:'rename', icon:'edit' },
      { label:'Delete file', value:'delete', icon:'trash', danger:true },
    ].filter(Boolean), `${fmtBytes(m.size)} · added ${fmtDate(m.addedAt)}`);
    try{
      if(v === 'open') return openFile(m);
      if(v === 'download') return downloadBlob(await typedBlob(m), m.name);
      if(v === 'share'){
        const blob = await typedBlob(m);
        const file = new File([blob], m.name, { type: blob.type });
        if(navigator.canShare({ files:[file] })) await navigator.share({ files:[file], title:m.name });
        else downloadBlob(blob, m.name);
        return;
      }
      if(v === 'rename'){
        const name = await uiPrompt('Rename file', m.name);
        if(!name) return;
        await renameFileMeta(m, name);
        return renderAll();
      }
      if(v === 'delete'){
        if(!(await uiConfirm(`Delete “${m.name}”?`, 'The file will be removed from this journal.', 'Delete file'))) return;
        await deleteFileIds([m.id]);
        showToast('File deleted', 'ok');
        return renderAll();
      }
    }catch(e){
      if(e && e.name === 'AbortError') return;       // share sheet closed
      showToast('Something went wrong: ' + (e.message || 'unknown error'));
    }
  }

    }else{
      const ext = m.name.includes('.') ? m.name.split('.').pop().toUpperCase() : '';

  async function attachFiles(page, list, sec){
    const tooBig = list.filter(f => f.size > MAX_FILE);

    if(!ok.length) return;
    if(sec) sec.classList.add('busy');
    try{
      const added = await addFiles(page.id, ok);
      showToast(added.length === 1 ? `Added ${added[0].name}` : `Added ${added.length} files`, 'ok');
    }catch(e){
      console.error('Adding files failed', e);
      showToast(e && e.name === 'QuotaExceededError' ? 'Not enough storage space on this device for that file.' : 'Couldn’t save the file: ' + ((e && e.message) || 'unknown error'));
    }finally{

  function filesSection(page){
    const list = filesOf(page.id);

    const input = el('input', { type:'file', multiple:true, style:'display:none', 'data-role':'file-input' });
    input.addEventListener('change', ()=>{ const picked = [...input.files]; input.value = ''; if(picked.length) attachFiles(page, picked, sec); });
    sec.appendChild(el('div', { class:'files-head' },
      el('div', { class:'section-label', text: list.length ? `Files · ${list.length}` : 'Files' }),
      actionBtn('Add file', 'clip', ()=> input.click())));
    sec.appendChild(input);

    else sec.appendChild(el('button', { class:'file-drop', type:'button', onclick: ()=> input.click() },
      'Add PDFs, screenshots or any other file to this journal. ', el('span', { class:'hint-desktop', text:'You can also drop files here.' })));
    const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
    ['dragenter', 'dragover'].forEach(t => sec.addEventListener(t, e => { if(hasFiles(e)){ e.preventDefault(); sec.classList.add('drag'); } }));
    sec.addEventListener('dragleave', e => { if(!sec.contains(e.relatedTarget)) sec.classList.remove('drag'); });
    sec.addEventListener('drop', e => {

      sec.classList.remove('drag');
      const dropped = [...e.dataTransfer.files];
      if(dropped.length) attachFiles(page, dropped, sec);
    });
    return sec;
  }

  function cleanApiMsg(m){

    if(/symbol/i.test(m) && /(invalid|not found|missing)/i.test(m)) return 'Ticker not found on Twelve Data.';

  async function ensureApiKey(){

  async function fetchQuickOpens(){
    if(quick.loading) return;
    if(!quick.tickers.length){ setQuickStatus('Add at least one ticker first.', 'err'); return; }
    const key = await ensureApiKey();
    if(!key){ setQuickStatus('An API key is needed to fetch prices.', 'err'); return; }
    const syms = quick.tickers.slice();
    quick.loading = true;
    quick.status = 'Fetching opening prices…'; quick.statusKind = '';
    if(view.type === 'quick') renderMain();
    try{
      for(let i = 0; i < syms.length; i += 8){                 // free plan: 8 prices per minute
        if(i > 0){
          for(let s = 61; s > 0; s--){ setQuickStatus(`Free plan limit — next ${Math.min(8, syms.length - i)} in ${s}s…`); await new Promise(r => setTimeout(r, 1000)); }
          setQuickStatus('Fetching opening prices…');
        }
        const chunk = syms.slice(i, i + 8);
        const url = 'https://api.twelvedata.com/time_series?symbol=' + encodeURIComponent(chunk.join(','))
          + '&interval=1day&outputsize=1&apikey=' + encodeURIComponent(key);
        let data;
        try{ const res = await fetch(url); data = await res.json(); }
        catch(e){ throw new Error('Couldn’t reach the data service. Check your internet connection.'); }
        if(!data) throw new Error('No data returned.');
        const single = chunk.length === 1;
        if(data.status === 'error' && (!single || [401, 403, 429].includes(data.code))) throw new Error(shortMsg(data.message || 'The data service returned an error.'));
        const bySym = single ? { [chunk[0]]: data } : data;
        chunk.forEach(sym => {
          const d = bySym[sym];
          if(!d || d.status === 'error' || !Array.isArray(d.values) || !d.values.length){
            quick.rows[sym] = { open:null, date:null, error: d && d.message ? shortMsg(d.message, 70) : 'No data for this ticker' };
            return;
          }
          const v = d.values[0], o = parseFloat(v.open);
          quick.rows[sym] = { open: isFinite(o) ? Number(o.toFixed(2)) : null, date: String(v.datetime).slice(0, 10), error:null };
        });
      }
      const today = new Date().toLocaleDateString('en-CA');
      const got = syms.filter(s => quick.rows[s] && quick.rows[s].open !== null);
      let msg = `✓ Loaded ${got.length} of ${syms.length} opening ${syms.length === 1 ? 'price' : 'prices'}.`;
      if(got.some(s => quick.rows[s].date !== today)) msg += ' Some are from the last trading day — today’s session hasn’t opened yet for those.';
      quick.status = msg; quick.statusKind = got.length ? 'ok' : 'err';
    }catch(e){
      quick.status = 'Couldn’t fetch prices: ' + e.message; quick.statusKind = 'err';
    }finally{
      quick.loading = false;
      if(view.type === 'quick') renderMain();
    }
  }

  /* ---------- RUBBERBAND MODEL (port of rubberband.py, model v6) ---------- */
  // Calibrated constants — copied unchanged from rubberband.py
  const RB_DRIFT_PER_DAY = 1.00124;
  const RB_V6_WINDOWS = [10, 20, 60];
  const RB_V6_K = { 68: [0.916, 0.943, 0.961, 0.976, 0.978], 90: [1.673, 1.711, 1.724, 1.742, 1.750] };
  const RB_V4_WINDOWS = [5, 20];
  const RB_SWING_WINDOWS = [10, 20, 60];
  const RB_SWING = { intercept:0.31, J:0.65, G:0.29, R:0.50, S:-0.26, low:0.76, high:1.28 };

  function rbStd(xs){                         // sample standard deviation (ddof = 1), like pandas
    const n = xs.length;
    if(n < 2) return NaN;
    let m = 0; for(const x of xs) m += x; m /= n;
    let s = 0; for(const x of xs) s += (x - m) * (x - m);
    return Math.sqrt(s / (n - 1));
  }
  function rbBlend(series, windows, extra){   // mean of the rolling std at the most recent row
    const needed = Math.max(...windows) + 1;
    const usable = series.length + (extra || 0);
    if(usable < needed) throw new Error(`needs at least ${needed} sessions of price history, got ${usable}`);
    return windows.reduce((s, w) => s + rbStd(series.slice(-w)), 0) / windows.length;
  }
  const rbCloseToClose = hist => hist.slice(1).map((b, i) => b.close / hist[i].close - 1);
  const rbOpenToClose = hist => hist.map(b => b.close / b.open - 1);

  function rbBandV6(hist, days, level){
    const sigma = rbBlend(rbCloseToClose(hist), RB_V6_WINDOWS, 1);
    const k = RB_V6_K[level][days - 1];
    const half = k * sigma * Math.sqrt(days);
    const last = hist[hist.length - 1].close;
    const centre = last * Math.pow(RB_DRIFT_PER_DAY, days);
    return { centre, lower: centre * (1 - half), upper: centre * (1 + half), half, sigma, k, last };
  }
  function rbBandV4Open(hist, open){
    const sigma = rbBlend(rbOpenToClose(hist), RB_V4_WINDOWS, 1);
    return { centre: open, lower: open * (1 - sigma), upper: open * (1 + sigma), half: sigma, sigma };
  }
  function rbSwing(hist, open){
    const y = hist[hist.length - 1];
    const j = rbBlend(rbOpenToClose(hist).map(x => x * 100), RB_SWING_WINDOWS, 1);
    const g = Math.abs(open / y.close - 1) * 100;
    const r = (y.high - y.low) / y.open * 100;
    const s = Math.abs(y.close / y.open - 1) * 100;
    const swing = RB_SWING.intercept + RB_SWING.J * j + RB_SWING.G * g + RB_SWING.R * r + RB_SWING.S * s;
    return { swing, low: RB_SWING.low * swing, high: RB_SWING.high * swing, J: j, G: g, R: r, S: s };
  }

  // Market clock (New York) — decides which session a journal entry belongs to
  function nyParts(ts){
    const f = new Intl.DateTimeFormat('en-CA', { timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23', weekday:'short' });
    const p = {};
    f.formatToParts(new Date(ts)).forEach(x => { p[x.type] = x.value; });
    const hour = parseInt(p.hour, 10) % 24;
    return { date: `${p.year}-${p.month}-${p.day}`, minutes: hour * 60 + parseInt(p.minute, 10), weekday: p.weekday };
  }
  const RB_OPEN_MIN = 9 * 60 + 30, RB_CLOSE_MIN = 16 * 60;
  function rbBarComplete(date, now){ return date < now.date || (date === now.date && now.minutes >= RB_CLOSE_MIN); }
  function rbEntrySession(addedAt){
    const p = nyParts(addedAt || Date.now());
    const weekend = p.weekday === 'Sat' || p.weekday === 'Sun';
    if(!weekend && p.minutes < RB_OPEN_MIN) return { date:p.date, strictlyBefore:true, live:false };   // before the bell: last session = previous day
    if(!weekend && p.minutes < RB_CLOSE_MIN) return { date:p.date, strictlyBefore:true, live:true };   // during the session: today's open is known
    return { date:p.date, strictlyBefore:false, live:false };                                           // after the close / weekend
  }
  function rbNextWeekday(dateStr, n){
    const d = new Date(dateStr + 'T12:00:00Z');
    let left = n;
    while(left > 0){ d.setUTCDate(d.getUTCDate() + 1); const w = d.getUTCDay(); if(w !== 0 && w !== 6) left--; }
    return d.toISOString().slice(0, 10);
  }
  function rbDay(dateStr){ return new Date(dateStr + 'T12:00:00').toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' }); }

  // One ticker: everything the screen shows
  function rbCompute(ticker, bars, entry, horizon, opts = {}){
    const now = nyParts(opts.now || Date.now());
    const S = rbEntrySession(entry && entry.addedAt);
    let bi = -1;
    for(let i = bars.length - 1; i >= 0; i--){
      if(S.strictlyBefore ? bars[i].date < S.date : bars[i].date <= S.date){ bi = i; break; }
    }
    while(bi >= 0 && !rbBarComplete(bars[bi].date, now)) bi--;
    if(bi < 0) throw new Error('No completed session found before this journal’s date.');
    const hist = bars.slice(0, bi + 1);
    const base = hist[hist.length - 1];
    const b68 = rbBandV6(hist, horizon, 68), b90 = rbBandV6(hist, horizon, 90);
    const it = { ticker, horizon, base:{ date: base.date, close: base.close, sessions: hist.length }, centre: b68.centre, sigma: b68.sigma, b68, b90 };

    const tgt = bars[bi + horizon];
    it.target = tgt ? { date: tgt.date, complete: rbBarComplete(tgt.date, now), estimated:false }
                    : { date: rbNextWeekday(base.date, horizon), complete:false, estimated:true };
    if(tgt && it.target.complete){
      const c = tgt.close;
      it.actual = { close:c, z: (c - b68.centre) / (b68.centre * b68.half),
                    in68: c >= b68.lower && c <= b68.upper, in90: c >= b90.lower && c <= b90.upper };
    }

    if(horizon === 1){
      const next = bars[bi + 1];
      let open = null, source = null;
      if(opts.typedOpen !== undefined && opts.typedOpen !== null && isFinite(opts.typedOpen)){ open = opts.typedOpen; source = 'typed'; }
      else if(next && isFinite(next.open)){ open = next.open; source = it.target.complete ? 'actual' : 'live'; }
      else if(S.live && entry && entry.price && num(entry.price.open) !== null){ open = entry.price.open; source = 'journal'; }
      else if(opts.quickRow && num(opts.quickRow.open) !== null && opts.quickRow.date && opts.quickRow.date > base.date){ open = opts.quickRow.open; source = 'quick'; }
      if(open !== null && open > 0){
        it.open = { value: open, source };
        try{
          it.v4open = rbBandV4Open(hist, open);
          if(it.actual) it.v4open.inBand = it.actual.close >= it.v4open.lower && it.actual.close <= it.v4open.upper;
        }catch(e){ it.v4openError = e.message; }
        try{
          const sw = rbSwing(hist, open);
          if(isFinite(sw.swing)){
            it.swing = sw;
            if(tgt && it.target.complete && isFinite(tgt.high) && isFinite(tgt.low)){
              it.swing.actual = (tgt.high - tgt.low) / tgt.open * 100;
              it.swing.inRange = it.swing.actual >= sw.low && it.swing.actual <= sw.high;
            }
          }
        }catch(e){ it.swingError = e.message; }
      }
    }
    return it;
  }

  const rb = { journalId:null, horizon:1, loading:false, status:'', statusKind:'', results:null, cache:{}, opens:{} };

  function rbStatus(msg, kind){
    rb.status = msg || ''; rb.statusKind = kind || '';
    const s = document.getElementById('rbStatus');
    if(s){ s.textContent = rb.status; s.className = 'q-status' + (rb.statusKind ? ' ' + rb.statusKind : ''); }
  }
  function keepScroll(fn){ const st = mainEl.scrollTop; return Promise.resolve(fn()).then(()=>{ mainEl.scrollTop = st; }); }
  async function copyText(text){
    try{ await navigator.clipboard.writeText(text); showToast('Copied to clipboard', 'ok'); }
    catch(e){
      const ta = el('textarea', { style:'position:fixed;top:0;left:0;opacity:0' });
      ta.value = text; document.body.appendChild(ta); ta.select();
      let ok = false; try{ ok = document.execCommand('copy'); }catch(_){}
      ta.remove();
      showToast(ok ? 'Copied to clipboard' : 'Copying isn’t available here', ok ? 'ok' : null);
    }
  }
  async function fetchHistoryBatch(chunk, key){
    const url = 'https://api.twelvedata.com/time_series?symbol=' + encodeURIComponent(chunk.join(','))
      + '&interval=1day&outputsize=400&apikey=' + encodeURIComponent(key);
    let data;
    try{ const res = await fetch(url); data = await res.json(); }
    catch(e){ throw new Error('Couldn’t reach the data service. Check your internet connection.'); }
    if(!data) throw new Error('No data returned.');
    const single = chunk.length === 1;
    if(data.status === 'error' && (!single || [401, 403, 429].includes(data.code))) throw new Error(shortMsg(data.message || 'The data service returned an error.'));
    const out = {};
    chunk.forEach(sym => {
      const d = single ? data : data[sym];
      if(!d || d.status === 'error' || !Array.isArray(d.values)){ out[sym] = { error: d && d.message ? shortMsg(d.message, 80) : 'No data for this ticker.' }; return; }
      const bars = d.values.map(v => ({ date: String(v.datetime).slice(0, 10), open: parseFloat(v.open), high: parseFloat(v.high), low: parseFloat(v.low), close: parseFloat(v.close) }))
        .filter(b => isFinite(b.open) && isFinite(b.close) && b.open > 0 && b.close > 0)
        .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
      out[sym] = { bars };
    });
    return out;
  }
  function rbRecompute(){
    if(!rb.results) return;
    const page = pageById(rb.results.journalId);
    if(!page){ rb.results = null; return; }
    const latest = latestByTicker(entriesCache[page.id]);
    rb.results.items = rb.results.tickers.map(t => {
      const c = rb.cache[t];
      if(!c) return { ticker:t, error:'No price data loaded yet — tap Predict.' };
      if(c.error) return { ticker:t, error:c.error };
      try{ return rbCompute(t, c.bars, latest.get(t), rb.horizon, { typedOpen: rb.opens[t], quickRow: quick.rows[t] }); }
      catch(e){ return { ticker:t, error:e.message }; }
    });
  }
  async function rbPredict(){
    if(rb.loading) return;
    const page = rb.journalId ? pageById(rb.journalId) : null;
    if(!page){ rbStatus('Choose a journal first.', 'err'); return; }
    const tickers = [...latestByTicker(entriesCache[page.id]).keys()].sort();
    if(!tickers.length){ rbStatus('This journal has no stocks yet.', 'err'); return; }
    const key = await ensureApiKey();
    if(!key){ rbStatus('An API key is needed to load price history.', 'err'); return; }
    rb.loading = true;
    rb.status = `Loading price history for ${plural(tickers.length, 'stock', 'stocks')}…`; rb.statusKind = '';
    if(view.type === 'rubberband') renderMain();
    try{
      for(let i = 0; i < tickers.length; i += 8){                 // free plan: 8 tickers per minute
        if(i > 0){
          for(let s = 61; s > 0; s--){ rbStatus(`Free plan limit — next ${Math.min(8, tickers.length - i)} in ${s}s…`); await new Promise(r => setTimeout(r, 1000)); }
          rbStatus('Loading price history…');
        }
        Object.assign(rb.cache, await fetchHistoryBatch(tickers.slice(i, i + 8), key));
      }
      rb.results = { journalId: page.id, tickers, items: [] };
      rbRecompute();
      const ok = rb.results.items.filter(x => !x.error).length;
      rb.status = `✓ Predicted ${ok} of ${plural(tickers.length, 'stock', 'stocks')}.`;
      rb.statusKind = ok ? 'ok' : 'err';
    }catch(e){
      rb.status = 'Couldn’t load prices: ' + e.message; rb.statusKind = 'err';
    }finally{
      rb.loading = false;
      if(view.type === 'rubberband') renderMain();
    }
  }

  const rbPrice = v => Number(v).toFixed(2);
  const rbPct = v => (v * 100).toFixed(2) + '%';
  const RB_OPEN_SOURCE = { typed:'entered by you', actual:'actual open', live:'today’s open (live)', journal:'from the journal', quick:'from Quick sheet' };

  function rbViz(it){
    const pts = [it.b90.lower, it.b90.upper, it.base.close];
    if(it.open) pts.push(it.open.value);
    if(it.actual) pts.push(it.actual.close);
    let lo = Math.min(...pts), hi = Math.max(...pts);
    const pad = (hi - lo) * 0.06 || hi * 0.01; lo -= pad; hi += pad;
    const x = v => ((v - lo) / (hi - lo) * 100);
    const span = (a, b) => `left:${x(a).toFixed(2)}%;width:${(x(b) - x(a)).toFixed(2)}%`;
    return el('div', { class:'rb-viz', 'aria-hidden':'true' },
      el('div', { class:'rb-track' }),
      el('div', { class:'rb-b90', style: span(it.b90.lower, it.b90.upper) }),
      el('div', { class:'rb-b68', style: span(it.b68.lower, it.b68.upper) }),
      el('div', { class:'rb-centre', style:`left:${x(it.centre).toFixed(2)}%` }),
      el('div', { class:'rb-mark last', style:`left:${x(it.base.close).toFixed(2)}%` }),
      it.open ? el('div', { class:'rb-mark open', style:`left:${x(it.open.value).toFixed(2)}%` }) : null,
      it.actual ? el('div', { class:'rb-mark ' + (it.actual.in68 ? 'hit' : 'miss'), style:`left:${x(it.actual.close).toFixed(2)}%` }) : null);
  }
  function rbRow(label, value, sub, cls){
    return el('tr', null, el('td', { text:label }), el('td', null, el('span', { class: cls || null, text:value }), sub ? el('span', { class:'sub', text:sub }) : null));

  function rbCard(it){
    if(it.error){
      return el('div', { class:'rb-card', 'data-ticker': it.ticker },
        el('div', { class:'rb-head' }, el('div', { class:'rb-ticker', text:it.ticker })),

    }
    const card = el('div', { class:'rb-card', 'data-ticker': it.ticker },
      el('div', { class:'rb-head' },
        el('div', { class:'rb-ticker', text:it.ticker }),
        el('div', { class:'rb-base' }, 'Last close · ' + rbDay(it.base.date), el('br'), el('b', { text: rbPrice(it.base.close) }))));
    const body = el('div', { class:'rb-body' });
    const when = it.horizon === 1 ? 'Forecast for the next session' : `Forecast ${it.horizon} sessions ahead`;
    body.appendChild(el('div', { class:'rb-target' }, when + ' · ', el('b', { text: (it.target.estimated ? '≈ ' : '') + rbDay(it.target.date) })));
    body.appendChild(rbViz(it));
    body.appendChild(el('div', { class:'rb-legend' },
      el('span', null, el('i', { class:'b68' }), '68%'), el('span', null, el('i', { class:'b90' }), '90%'),
      el('span', null, el('i', { class:'last' }), 'last close'),
      it.open ? el('span', null, el('i', { class:'open' }), 'open') : null,
      it.actual ? el('span', null, el('i', { style:`background:var(--${it.actual.in68 ? 'sage' : 'rust'})` }), 'actual close') : null));

    const rows = [
      rbRow('68% band', `${rbPrice(it.b68.lower)} – ${rbPrice(it.b68.upper)}`, '±' + rbPct(it.b68.half)),
      rbRow('90% band', `${rbPrice(it.b90.lower)} – ${rbPrice(it.b90.upper)}`, '±' + rbPct(it.b90.half)),
      rbRow('Centre', rbPrice(it.centre), 'last close + typical drift'),
    ];
    if(it.actual){
      const verdict = it.actual.in68 ? 'inside the 68% band' : it.actual.in90 ? 'outside 68%, inside 90%' : 'outside both bands';
      rows.push(rbRow('Actual close', rbPrice(it.actual.close), `${verdict} · z ${it.actual.z >= 0 ? '+' : '−'}${Math.abs(it.actual.z).toFixed(2)}`,
        it.actual.in68 ? 'ok' : it.actual.in90 ? 'mid' : 'bad'));
    }
    body.appendChild(el('table', { class:'rb-rows' }, el('tbody', null, rows)));

    if(it.horizon === 1){
      if(it.open){
        const o = it.open.value;
        const orow = [rbRow('Open', rbPrice(o), RB_OPEN_SOURCE[it.open.source] || '')];
        if(it.v4open){
          orow.push(rbRow('Band from the open', `${rbPrice(it.v4open.lower)} – ${rbPrice(it.v4open.upper)}`,
            '±' + rbPct(it.v4open.half) + ' · v4-open' + (it.actual ? (it.v4open.inBand ? ' · close landed inside' : ' · close landed outside') : ''),
            it.actual ? (it.v4open.inBand ? 'ok' : 'bad') : null));
        }
        if(it.swing){
          const sw = it.swing;
          orow.push(rbRow('Expected swing', sw.swing.toFixed(2) + '%', `usually ${sw.low.toFixed(2)}–${sw.high.toFixed(2)}% · ≈ ${rbPrice(o * sw.swing / 100)} high-to-low`));
          if(sw.actual !== undefined) orow.push(rbRow('Actual swing', sw.actual.toFixed(2) + '%', sw.inRange ? 'within the usual range' : (sw.actual < sw.low ? 'calmer than usual' : 'wilder than usual'), sw.inRange ? 'ok' : 'mid'));
        }
        body.appendChild(el('div', { class:'rb-section', text:'From today’s open' }));
        body.appendChild(el('table', { class:'rb-rows' }, el('tbody', null, orow)));
      }
      if(!it.target.complete){
        const inp = el('input', { type:'number', step:'0.01', inputmode:'decimal', placeholder:'e.g. ' + rbPrice(it.base.close), 'aria-label': it.ticker + ' open' });
        if(rb.opens[it.ticker] !== undefined && rb.opens[it.ticker] !== null) inp.value = String(rb.opens[it.ticker]);
        const apply = ()=>{
          const v = numOrNull(inp.value);
          if(v === (rb.opens[it.ticker] ?? null)) return;          // nothing changed (e.g. blur right after Enter)
          rb.opens[it.ticker] = v;
          rbRecompute();
          setTimeout(()=> keepScroll(renderMain), 0);              // let the input finish its events first
        };
        inp.addEventListener('change', apply);
        inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); apply(); } });
        body.appendChild(el('div', { class:'rb-open' },
          el('span', { text: it.open ? 'Different open?' : 'Know today’s open?' }), inp,
          el('span', { text:'adds the band from the open and the expected swing' })));
      }
    }
    card.appendChild(body);
    return card;
  }
  function rbText(){
    const page = rb.results ? pageById(rb.results.journalId) : null;
    const when = rb.horizon === 1 ? 'next session' : `${rb.horizon} sessions ahead`;
    const lines = [`Rubberband v6 — ${page ? page.name : 'journal'} — ${when}`];
    (rb.results ? rb.results.items : []).forEach(it => {
      if(it.error){ lines.push(`${it.ticker}: ${it.error}`); return; }
      lines.push(`${it.ticker} (close ${rbDay(it.base.date)}: ${rbPrice(it.base.close)}) → 68%: ${rbPrice(it.b68.lower)}–${rbPrice(it.b68.upper)} (±${rbPct(it.b68.half)}) | 90%: ${rbPrice(it.b90.lower)}–${rbPrice(it.b90.upper)} (±${rbPct(it.b90.half)})`);
      if(it.open && it.v4open) lines.push(`   open ${rbPrice(it.open.value)} → ${rbPrice(it.v4open.lower)}–${rbPrice(it.v4open.upper)}` + (it.swing ? ` · swing ${it.swing.swing.toFixed(2)}% (${it.swing.low.toFixed(2)}–${it.swing.high.toFixed(2)}%)` : ''));
      if(it.actual) lines.push(`   actual ${rbPrice(it.actual.close)} — ${it.actual.in68 ? 'inside 68%' : it.actual.in90 ? 'inside 90%' : 'outside'} (z ${it.actual.z.toFixed(2)})`);
    });
    return lines.join('\n');
  }

  /* ---------- NAVIGATION (hash routes, so the phone's back gesture works) ---------- */
  function viewToHash(v){
    if(v.type === 'journal') return '#/journal/' + v.id;
    if(v.type === 'folder') return '#/folder/' + v.id;
    if(v.type === 'compare'){
      const q = new URLSearchParams();
      if(v.a) q.set('a', v.a);
      if(v.b) q.set('b', v.b);
      const s = q.toString();
      return '#/compare' + (s ? '?' + s : '');
    }
    if(v.type === 'quick') return '#/quick';
    if(v.type === 'rubberband') return '#/rubberband' + (v.j ? '?j=' + encodeURIComponent(v.j) : '');
    return '#/library';
  }
  function parseHash(hash){
    const m = /^#\/(library|journal|folder|compare|quick|rubberband)(?:\/([^?]+))?(?:\?(.*))?$/.exec(hash || '');
    if(!m) return null;
    if(m[1] === 'journal' || m[1] === 'folder') return m[2] ? { type:m[1], id: decodeURIComponent(m[2]) } : null;
    if(m[1] === 'compare'){ const q = new URLSearchParams(m[3] || ''); return { type:'compare', a:q.get('a'), b:q.get('b') }; }
    if(m[1] === 'quick') return { type:'quick' };
    if(m[1] === 'rubberband'){ const q = new URLSearchParams(m[3] || ''); return { type:'rubberband', j: q.get('j') }; }
    return { type:'library' };
  }
  function normalizeView(v){
    if(!v) return { type:'library' };
    if(v.type === 'journal' && !pageById(v.id)) return { type:'library' };
    if(v.type === 'folder' && !folderById(v.id)) return { type:'library' };
    if(v.type === 'compare') return { type:'compare', a: pageById(v.a) ? v.a : null, b: pageById(v.b) ? v.b : null };
    if(v.type === 'rubberband') return { type:'rubberband', j: pageById(v.j) ? v.j : null };
    return v;
  }
  function go(v, replace){
    const target = viewToHash(v);
    if(replace || location.hash === target){
      history.replaceState(null, '', target);
      route();
    }else{
      location.hash = target;   // fires hashchange -> route()
    }
  }
  function route(){
    if(closeOpenSheet) closeOpenSheet(null);
    view = normalizeView(parseHash(location.hash));
    const canonical = viewToHash(view);
    if(canonical !== location.hash) history.replaceState(null, '', canonical);
    activePageId = view.type === 'journal' ? view.id : null;
    if(view.type === 'journal'){
      const p = pageById(view.id);
      if(p && p.folderId) expandedFolders.add(p.folderId);
    }
    if(view.type === 'folder') expandedFolders.add(view.id);
    formOpen = false;
    try{ localStorage.setItem(LAST_VIEW_KEY, canonical); }catch(e){}
    renderAll();
    mainEl.scrollTop = 0;
  }

      navBtn('library', 'Library', 'library', { type:'library' }, !['compare', 'quick', 'rubberband'].includes(view.type)),

    const out = [];
    const fs = sortedFolders();
    if(fs.length){

  function treeJournal(p){

    return el('button', { class:'tree-item' + (view.type === 'journal' && view.id === p.id ? ' active' : ''), type:'button', onclick: ()=> go({ type:'journal', id:p.id }) },

  /* ---------- COMPARE ENGINE ---------- */
  function num(v){ return (typeof v === 'number' && isFinite(v)) ? v : null; }
  function latestByTicker(entries){
    const m = new Map();
    (entries || []).forEach(e => {                       // entries are stored newest first
      const k = (e.name || '').trim().toUpperCase();
      if(k && !m.has(k)) m.set(k, e);
    });
    return m;
  }
  function emaStatus(entry, p){
    const v = entry.ema ? entry.ema[p] : null;
    if(v === 'above' || v === 'below') return v;           // entries from the old Above/Below version
    const e = num(v), c = num(entry.price && entry.price.close);
    if(e === null || c === null) return null;
    return c >= e ? 'above' : 'below';
  }
  function crossDir(a1, b1, a2, b2){                       // did (a - b) change sign from 1 to 2?
    if([a1, b1, a2, b2].some(v => v === null)) return 0;
    const s1 = Math.sign(a1 - b1), s2 = Math.sign(a2 - b2);
    if(s1 <= 0 && s2 > 0) return 1;
    if(s1 >= 0 && s2 < 0) return -1;
    return 0;
  }
  function detectSignals(a, b){
    const out = [];
    [['Daily', 'daily'], ['Weekly', 'weekly']].forEach(([label, k]) => {
      const A = a[k] || {}, B = b[k] || {};
      const c = crossDir(num(A.macd), num(A.signal), num(B.macd), num(B.signal));
      if(c) out.push({ dir: c > 0 ? 'bull' : 'bear', text: `${label} MACD crossed ${c > 0 ? 'above' : 'below'} its signal line` });
      const z = crossDir(num(A.macd), 0, num(B.macd), 0);
      if(z) out.push({ dir: z > 0 ? 'bull' : 'bear', text: `${label} MACD crossed ${z > 0 ? 'above' : 'below'} zero` });
      [30, 50, 70].forEach(lv => {
        const r = crossDir(num(A.rsi), lv, num(B.rsi), lv);
        if(!r) return;
        let dir = r > 0 ? 'bull' : 'bear', note = '';
        if(r > 0 && lv === 70){ dir = 'warn'; note = ' — overbought'; }
        if(r < 0 && lv === 30){ dir = 'warn'; note = ' — oversold'; }
        if(r > 0 && lv === 30) note = ' — out of oversold';
        if(r < 0 && lv === 70) note = ' — out of overbought';
        out.push({ dir, text: `${label} RSI crossed ${r > 0 ? 'above' : 'below'} ${lv}${note}` });
      });
    });
    EMA_PERIODS.forEach(p => {
      const sa = emaStatus(a, p), sb = emaStatus(b, p);
      if(sa && sb && sa !== sb) out.push({ dir: sb === 'above' ? 'bull' : 'bear', text: `Price moved ${sb} EMA ${p}` });
    });
    return out;
  }
  function fmtVal(v, kind){
    const n = num(v);
    if(n === null) return '—';
    if(kind === 'vol') return fmtVolume(n);
    return n.toFixed(kind === 'macd' ? 3 : 2);
  }
  function signed(n, dec){ return (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n).toFixed(dec); }
  function deltaCell(a, b, kind){
    const x = num(a), y = num(b);
    if(x === null || y === null) return el('td', { class:'flat', text:'—' });
    const d = y - x;
    const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
    const pct = x !== 0 ? d / Math.abs(x) * 100 : null;
    if(kind === 'vol') return el('td', { class:cls, text: pct === null ? '—' : signed(pct, 1) + '%' });
    if(kind === 'price') return el('td', { class:cls }, signed(d, 2), pct === null ? null : el('span', { class:'d-sub', text: signed(pct, 2) + '%' }));
    return el('td', { class:cls, text: signed(d, kind === 'macd' ? 3 : 2) });
  }
  function cmpTable(rows){
    const body = el('tbody', null, rows.map(r => el('tr', { class: r.flip ? 'flip' : null },
      el('td', { text:r.label }),
      el('td', null, fmtVal(r.a, r.kind), r.aNote ? el('span', { class:'st ' + r.aNote.cls, text:r.aNote.t }) : null),
      el('td', null, fmtVal(r.b, r.kind), r.bNote ? el('span', { class:'st ' + r.bNote.cls, text:r.bNote.t }) : null),
      deltaCell(r.a, r.b, r.kind))));
    return el('div', { class:'cmp-scroll' }, el('table', { class:'cmp-table' },
      el('thead', null, el('tr', null, el('th', { text:'' }), el('th', { text:'A' }), el('th', { text:'B' }), el('th', { text:'Change' }))), body));
  }
  function cmpCard(r){
    const ca = num(r.a.price && r.a.price.close), cb = num(r.b.price && r.b.price.close);
    let closeInfo;
    if(ca !== null && cb !== null){
      const d = cb - ca, pct = ca !== 0 ? d / Math.abs(ca) * 100 : 0;
      closeInfo = el('div', { class:'cmp-close' }, `Close ${ca.toFixed(2)} → ${cb.toFixed(2)}`,
        el('span', { class:'chg ' + (d > 0 ? 'up' : d < 0 ? 'down' : 'flat'), text: signed(pct, 2) + '%' }));
    }else closeInfo = el('div', { class:'cmp-close', text:'Close —' });
    const card = el('div', { class:'cmp-card', 'data-ticker': r.t }, el('div', { class:'cmp-head' }, el('div', { class:'cmp-ticker', text:r.t }), closeInfo));
    const A = r.a, B = r.b;
    if(compareTab === 'signals'){
      card.appendChild(r.sigs.length
        ? el('div', { class:'sig-list' }, r.sigs.map(s => el('div', { class:'sig ' + s.dir }, el('span', { class:'dot' }), el('span', { text:s.text }))))
        : el('div', { class:'sig-none', text:'No signal changes between these journals.' }));
    }else if(compareTab === 'daily' || compareTab === 'weekly'){
      const a = A[compareTab] || {}, b = B[compareTab] || {};
      card.appendChild(cmpTable([
        { label:'RSI (14)', a:a.rsi, b:b.rsi, kind:'rsi' },
        { label:'MACD', a:a.macd, b:b.macd, kind:'macd' },
        { label:'Signal', a:a.signal, b:b.signal, kind:'macd' },
        { label:'Volume', a:a.volume, b:b.volume, kind:'vol' },
      ]));
    }else if(compareTab === 'ema'){
      const note = s => s ? { t: s === 'above' ? '▲' : '▼', cls: s === 'above' ? 'up' : 'down' } : null;
      card.appendChild(cmpTable(EMA_PERIODS.map(p => {
        const sa = emaStatus(A, p), sb = emaStatus(B, p);
        return { label:'EMA ' + p, a: A.ema ? A.ema[p] : null, b: B.ema ? B.ema[p] : null, kind:'price', aNote: note(sa), bNote: note(sb), flip: !!(sa && sb && sa !== sb) };
      })));
    }else{
      const a = A.price || {}, b = B.price || {};
      card.appendChild(cmpTable([
        { label:'Open', a:a.open, b:b.open, kind:'price' },
        { label:'High', a:a.high, b:b.high, kind:'price' },
        { label:'Low', a:a.low, b:b.low, kind:'price' },
        { label:'Close', a:a.close, b:b.close, kind:'price' },
      ]));
    }
    return card;
  }

    if(view.type === 'folder'){ const f = folderById(view.id); if(f) return { label:f.name, groups:[{ title:null, pages: journalsIn(f.id) }] }; }

  function numOrNull(v){
    if(v === '' || v === null || v === undefined) return null;
    const n = parseFloat(v);
    return isNaN(n) ? null : n;
  }

  /* ---------- AUTO-FILL: API KEY ---------- */
  const API_KEY_STORE = 'stock-journal-twelvedata-key';
  let apiKeyMem = null;

  async function getApiKey(){
    if(apiKeyMem) return apiKeyMem;
    try{
      const k = localStorage.getItem(API_KEY_STORE);
      if(k){ apiKeyMem = k; return k; }
    }catch(e){}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Stock Journal</title>
<meta name="theme-color" content="#08090a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #08090a;
    --panel: #131316;
    --panel-raised: #1b1b1f;
    --line: #2b2b30;
    --line-warm: #38383e;
    --paper: #f2f2f0;
    --muted: #8c8d93;
    --gold: #c9cbd2;
    --silver-hi: #f4f5f7;
    --silver-lo: #9a9ca3;
    --sage: #74ab8e;
    --rust: #c1654f;
    --app-h: 100vh;
  }
  @supports (height:100dvh){ :root{ --app-h: 100dvh; } }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 800px at 90% -10%, rgba(210,213,220,0.05), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(180,183,190,0.035), transparent 55%),
      var(--bg);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    display:grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: var(--app-h);
    height:var(--app-h);
    overflow:hidden;
  }

  /* ---------- SIDEBAR / LEDGER SPINE ---------- */
  .spine{
    background: linear-gradient(180deg, #131315, #08090a);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    height:var(--app-h);
    min-height:0;
    overflow:hidden;
  }
  .spine-head{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .v-logo{
    flex-shrink:0;
    width:36px;
    height:36px;
    border-radius:8px;
    background:linear-gradient(155deg, #1c1c1f, #000);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
  }
  .spine-head .mark{
    font-family:'Fraunces', serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:0.02em;
    line-height:1.15;
  }
  .spine-head .sub{
    margin-top:2px;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .pages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:10px 0;
  }
  .page-tab{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 16px 11px 20px;
    margin:2px 10px;
    border-radius:3px;
    cursor:pointer;
    color:var(--muted);
    border-left:2px solid transparent;
    transition:background .15s ease, color .15s ease;
  }
  .page-tab:hover{ background:var(--panel-raised); color:var(--paper); }
  .page-tab.active{
    background:var(--panel-raised);
    color:var(--paper);
    border-left:2px solid var(--gold);
  }
  .page-tab .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--gold);
    opacity:0.75;
    width:18px;
    flex-shrink:0;
  }
  .page-tab .label{
    flex:1;
    font-size:13.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    outline:none;
  }
  .page-tab .label[contenteditable="true"]{
    color:var(--paper);
    border-bottom:1px dashed var(--gold);
  }
  .page-tab .count{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
  }
  .page-tab .del{
    display:none;
    color:var(--rust);
    font-size:14px;
    padding:0 2px;
  }
  .page-tab:hover .del{ display:inline; }

  .add-page{
    margin:10px 10px 16px;
    padding:10px 14px;
    border:1px dashed var(--line);
    border-radius:3px;
    color:var(--muted);
    font-size:12.5px;
    text-align:center;
    cursor:pointer;
    letter-spacing:0.03em;
    transition:border-color .15s ease, color .15s ease;
  }
  .add-page:hover{ border-color:var(--gold); color:var(--gold); }

  /* ---------- MAIN ---------- */
  .main{
    height:var(--app-h);
    min-height:0;
    overflow-y:auto;
    padding:36px 48px 80px;
  }
  .main-empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:14px;
    text-align:center;
    flex-direction:column;
    gap:10px;
  }
  .main-empty .big{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:22px;
    color:var(--paper);
  }

  .page-header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    border-bottom:1px solid var(--line-warm);
    padding-bottom:16px;
    margin-bottom:28px;
  }
  .page-title-wrap{ min-width:0; }
  .page-title{
    font-family:'Fraunces', serif;
    font-size:30px;
    font-weight:600;
    line-height:1.15;
    overflow-wrap:anywhere;
  }
  .page-meta{
    margin-top:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:0.04em;
  }
  .page-actions{ display:flex; gap:8px; flex-shrink:0; }
  .page-action{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:3px;
    padding:7px 11px;
    font-size:11.5px;
    font-family:'Inter', sans-serif;
    cursor:pointer;
  }
  .page-action:hover{ color:var(--paper); border-color:var(--paper); }
  .page-action.danger:hover{ color:var(--rust); border-color:var(--rust); }

  #toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%, 20px);
    max-width:calc(100% - 32px);
    background:var(--panel-raised);
    border:1px solid var(--rust);
    color:var(--paper);
    font-size:12.5px;
    padding:10px 14px;
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:50;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  .head-actions{ display:flex; gap:8px; margin-top:16px; }
  .head-btn{
    flex:1;
    background:var(--panel-raised);
    border:1px solid var(--line);
    color:var(--paper);
    font-size:11px;
    padding:9px 6px;
    border-radius:3px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    white-space:nowrap;
  }
  .head-btn:hover{ border-color:var(--gold); }
  #installBtn{ display:none; }

  .add-stock-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    background:linear-gradient(135deg, var(--silver-hi), var(--gold) 55%, var(--silver-lo));
    color:#101012;
    font-weight:600;
    font-size:13px;
    border-radius:3px;
    cursor:pointer;
    border:none;
    letter-spacing:0.02em;
    margin-bottom:26px;
    transition:filter .15s ease;
  }
  .add-stock-btn:hover{ filter:brightness(1.08); }

  /* ---------- ENTRY FORM ---------- */
  .entry-form{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:22px 24px;
    margin-bottom:24px;
  }
  .entry-form .row1{
    margin-bottom:16px;
  }
  .entry-form input[type="text"]{
    width:100%;
    max-width:280px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--paper);
    font-family:'Fraunces', serif;
    font-size:19px;
    padding:6px 2px;
    outline:none;
  }
  .entry-form input[type="text"]:focus{ border-color:var(--gold); }
  .entry-form input[type="text"]::placeholder{ color:var(--muted); font-style:italic; }

  .name-row{ display:flex; align-items:center; gap:10px; }
  .name-row input[type="text"]{ flex:1; min-width:0; }
  .autofill-btn{
    flex-shrink:0;
    padding:9px 13px;
    border-radius:3px;
    border:1px solid var(--line);
    background:var(--panel-raised);
    color:var(--paper);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    white-space:nowrap;
  }
  .autofill-btn:hover{ border-color:var(--gold); }
  .autofill-btn:disabled{ opacity:0.5; cursor:default; }
  .key-btn{
    flex-shrink:0;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:3px;
    padding:8px 9px;
    font-size:12px;
    cursor:pointer;
  }
  .af-status{ font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.45; }
  .af-status:empty{ display:none; }
  .af-status.err{ color:var(--rust); }
  .af-status.ok{ color:var(--sage); }
  .key-row{ display:flex; gap:8px; margin-top:10px; }
  .entry-form .key-row input[type="text"]{
    flex:1;
    min-width:0;
    max-width:none;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:3px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    padding:8px 9px;
  }
  .entry-form .key-row input[type="text"]::placeholder{ font-style:normal; }

  .tf-columns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
  }

  .ema-block{
    margin-top:20px;
    background:var(--panel-raised);
    border:1px solid var(--line);
    border-radius:5px;
    padding:16px;
  }
  .ema-block .tf-label{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:12px;
    font-weight:600;
  }
  .ema-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
    gap:12px;
  }
  .ema-field{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .ema-field .ema-name{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--muted);
    flex-shrink:0;
  }
  .ema-field input[type="number"]{
    width:100px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:6px 8px;
    text-align:right;
    outline:none;
  }
  .ema-field input[type="number"]:focus{ border-color:var(--gold); }

  .price-block{
    margin-top:20px;
    background:var(--panel-raised);
    border:1px solid var(--line);
    border-radius:5px;
    padding:16px;
  }
  .price-block .tf-label{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:12px;
    font-weight:600;
  }
  .price-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));
    gap:14px;
  }
  .price-field label{
    display:block;
    font-size:11px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .price-field input[type="number"]{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:8px 9px;
    outline:none;
  }
  .price-field input[type="number"]:focus{ border-color:var(--gold); }

  .price-readout{
    grid-column: 1 / -1;
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    margin-top:2px;
    padding-top:12px;
    border-top:1px dotted var(--line);
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
  }
  .price-readout .p .k{ color:var(--muted); margin-right:5px; }
  .price-readout .p .v{ color:var(--paper); }
  .price-readout .p .v.hi{ color:var(--sage); }
  .price-readout .p .v.lo{ color:var(--rust); }
  .tf-col{
    background:var(--panel-raised);
    border:1px solid var(--line);
    border-radius:5px;
    padding:16px;
  }
  .tf-col .tf-label{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:12px;
    font-weight:600;
  }
  .field{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .field:last-child{ margin-bottom:0; }
  .field label{
    font-size:12.5px;
    color:var(--muted);
  }
  .field input[type="number"]{
    width:100px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:6px 8px;
    text-align:right;
    outline:none;
  }
  .field input[type="number"]:focus{ border-color:var(--gold); }

  .form-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
    justify-content:flex-end;
  }
  .btn{
    padding:9px 16px;
    border-radius:3px;
    font-size:12.5px;
    cursor:pointer;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    font-family:'Inter', sans-serif;
  }
  .btn:hover{ color:var(--paper); border-color:var(--paper); }
  .btn.primary{
    background:linear-gradient(135deg, var(--silver-hi), var(--gold) 55%, var(--silver-lo));
    color:#101012;
    border-color:var(--gold);
    font-weight:600;
  }
  .btn.primary:hover{ filter:brightness(1.08); }

  /* ---------- STOCK LEDGER ROWS ---------- */
  .ledger{
    border-top:1px solid var(--line-warm);
  }
  .stock-row{
    display:grid;
    grid-template-columns: 150px 1fr 1fr 32px;
    align-items:center;
    gap:20px;
    padding:16px 4px;
    border-bottom:1px solid var(--line);
  }
  .stock-name{
    font-family:'Fraunces', serif;
    font-size:18px;
  }
  .stock-name .signal-dot{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    margin-right:8px;
    position:relative;
    top:-2px;
  }
  .tf-readout{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
  }
  .tf-readout .tf-tag{
    font-size:9.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
    display:block;
    margin-bottom:4px;
  }
  .metric-group{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
  }
  .metric-group .m{ margin-right:12px; }
  .metric-group .m .k{ color:var(--muted); margin-right:4px; }
  .metric-group .m .v.pos{ color:var(--sage); }
  .metric-group .m .v.neg{ color:var(--rust); }
  .metric-group .m .v.neu{ color:var(--paper); }
  .row-del{
    color:var(--muted);
    text-align:center;
    cursor:pointer;
    font-size:15px;
  }
  .row-del:hover{ color:var(--rust); }

  .ema-readout{
    grid-column: 1 / -1;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:2px;
    padding-top:12px;
    border-top:1px dotted var(--line);
  }
  .ema-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:3px 8px;
    border-radius:3px;
    background:var(--panel-raised);
    border:1px solid var(--line);
  }
  .ema-tag .k{ color:var(--muted); margin-right:5px; }
  .ema-tag.above{ color:var(--sage); border-color:rgba(116,171,142,0.35); }
  .ema-tag.below{ color:var(--rust); border-color:rgba(193,101,79,0.35); }
  .ema-tag.unset{ color:var(--muted); opacity:0.5; }

  .empty-ledger{
    padding:40px 4px;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
  }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:#2c2c31; border-radius:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width:720px){
    .app{ grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); }
    .spine{
      height:auto;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
      border-right:none;
      border-bottom:1px solid var(--line);
    }
    .spine-head{
      grid-column:1 / -1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px 10px;
      border-bottom:none;
    }
    .head-actions{ margin-top:0; flex:0 0 auto; }
    .head-btn{ flex:0 0 auto; padding:8px 11px; }
    .pages{
      display:flex;
      flex-direction:row;
      gap:6px;
      overflow-x:auto;
      overflow-y:hidden;
      padding:4px 0 12px 16px;
      scrollbar-width:none;
    }
    .pages::-webkit-scrollbar{ display:none; }
    .page-tab{
      flex:0 0 auto;
      margin:0;
      padding:8px 13px;
      gap:6px;
      max-width:180px;
      border:1px solid var(--line);
      border-radius:999px;
    }
    .page-tab.active{ border:1px solid var(--gold); background:var(--panel-raised); }
    .page-tab .num{ display:none; }
    .page-tab .del, .page-tab:hover .del{ display:none; }
    .add-page{
      margin:4px 16px 12px 8px;
      padding:8px 13px;
      border-radius:999px;
      font-size:12px;
      white-space:nowrap;
    }
    .main{ height:auto; min-height:0; padding:22px 16px 60px; }
    .page-title{ font-size:24px; }
    .tf-columns{ grid-template-columns:1fr; }
    .stock-row{ grid-template-columns:1fr; gap:8px; }
    .stock-row{ position:relative; }
    .row-del{ position:absolute; top:12px; right:0; padding:6px 8px; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="app">
  <div class="spine">
    <div class="spine-head">
      <div class="brand-row">
        <div class="v-logo" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 4 L12 20 L21 4" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="mark">Ledger</div>
          <div class="sub">Stock Journal</div>
        </div>
      </div>
      <div class="head-actions">
        <button id="pdfBtn" class="head-btn" type="button">⬇ Save as PDF</button>
        <button id="installBtn" class="head-btn" type="button">📲 Install app</button>
      </div>
    </div>
    <div class="pages" id="pagesList"></div>
    <div class="add-page" id="addPageBtn" role="button">+ New page</div>
  </div>
  <div class="main" id="main"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const PAGES_KEY = 'stock-journal-pages';
  const entriesKey = (pageId) => `stock-journal-entries:${pageId}`;

  let pages = [];
  let activePageId = null;
  let entriesCache = {}; // pageId -> array
  let formOpen = false;

  const pagesListEl = document.getElementById('pagesList');
  const mainEl = document.getElementById('main');

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  /* ---------- ON-DEVICE STORAGE ---------- */
  let saveWarned = false;
  function showToast(msg){
    const t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(()=> t.classList.remove('show'), 4000);
  }
  const store = {
    get(key){
      try{ return localStorage.getItem(key); }catch(e){ return null; }
    },
    set(key, value){
      try{ localStorage.setItem(key, value); return true; }
      catch(e){
        console.error('Save failed', e);
        if(!saveWarned){ saveWarned = true; showToast('Couldn\'t save on this device. Check that the browser allows site storage.'); }
        return false;
      }

  async function loadPages(){
    try{
      const raw = store.get(PAGES_KEY);
      pages = raw ? JSON.parse(raw) : [];
    }catch(e){
      pages = [];
    }
  }

    store.set(PAGES_KEY, JSON.stringify(pages));
  }

  async function loadEntries(pageId){
    if(entriesCache[pageId]) return entriesCache[pageId];
    try{
      const raw = store.get(entriesKey(pageId));
      const val = raw ? JSON.parse(raw) : [];
      entriesCache[pageId] = val;
      return val;
    }catch(e){
      entriesCache[pageId] = [];
      return [];
    }
  }

  async function saveEntries(pageId, entries){
    entriesCache[pageId] = entries;
    store.set(entriesKey(pageId), JSON.stringify(entries));
  }

  function fmtDate(ts){
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }

  function fmtVolume(v){
    if(v === null || v === undefined) return '—';
    if(v >= 1e9) return (v/1e9).toFixed(2).replace(/\.00$/,'') + 'B';
    if(v >= 1e6) return (v/1e6).toFixed(2).replace(/\.00$/,'') + 'M';
    if(v >= 1e3) return (v/1e3).toFixed(1).replace(/\.0$/,'') + 'K';
    return String(v);
  }

  function rsiClass(val){
    if(val === null || val === undefined || val === '') return 'neu';
    if(val >= 70) return 'neg';
    if(val <= 30) return 'pos';
    return 'neu';
  }

  function macdClass(macd, signal){
    if(macd === null || macd === undefined || macd === '' || signal === null || signal === undefined || signal === '') return 'neu';
    return macd >= signal ? 'pos' : 'neg';
  }

  function overallSignalColor(entry){
    // combine daily + weekly RSI extremes for a quick-glance dot
    const vals = [entry.daily.rsi, entry.weekly.rsi].filter(v => v !== null && v !== undefined && v !== '');

  /* ---------- AUTO-FILL: DATA ---------- */
  async function fetchDailyBars(symbol, apiKey){
    const url = 'https://api.twelvedata.com/time_series'
      + '?symbol=' + encodeURIComponent(symbol)
      + '&interval=1day&outputsize=2500'
      + '&apikey=' + encodeURIComponent(apiKey);
    let data;
    try{
      const res = await fetch(url);
      data = await res.json();
    }catch(e){
      throw new Error('Couldn\'t reach the data service. Check your internet connection.');
    }
    if(!data || data.status === 'error' || !Array.isArray(data.values)){
      const msg = (data && data.message) ? data.message : 'No data returned for this ticker.';
      throw new Error(msg.length > 180 ? msg.slice(0, 180) + '…' : msg);
    }
    const bars = data.values.map(v => ({
      date: String(v.datetime).slice(0, 10),
      open: parseFloat(v.open),
      high: parseFloat(v.high),
      low: parseFloat(v.low),
      close: parseFloat(v.close),
      volume: v.volume !== undefined ? parseFloat(v.volume) : NaN
    })).filter(b => isFinite(b.close));
    bars.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    if(!bars.length) throw new Error('No price data returned for this ticker.');
    return bars;
  }

  function weekKey(dateStr){
    const d = new Date(dateStr + 'T00:00:00Z');
    const dow = (d.getUTCDay() + 6) % 7; // Monday = 0
    d.setUTCDate(d.getUTCDate() - dow);
    return d.toISOString().slice(0, 10);
  }

  function toWeekly(daily){
    const weeks = [];
    let cur = null;
    for(const b of daily){
      const k = weekKey(b.date);
      if(!cur || cur.key !== k){
        cur = { key:k, open:b.open, high:b.high, low:b.low, close:b.close,
                volume: isFinite(b.volume) ? b.volume : 0, hasVol: isFinite(b.volume) };
        weeks.push(cur);
      }else{
        cur.high = Math.max(cur.high, b.high);
        cur.low = Math.min(cur.low, b.low);
        cur.close = b.close;
        if(isFinite(b.volume)){ cur.volume += b.volume; cur.hasVol = true; }
      }
    }
    return weeks;
  }

  // EMA seeded with the simple average of the first `period` values
  function emaSeries(values, period){
    const out = new Array(values.length).fill(null);
    if(values.length < period) return out;
    let sum = 0;
    for(let i = 0; i < period; i++) sum += values[i];
    let prev = sum / period;
    out[period - 1] = prev;
    const k = 2 / (period + 1);
    for(let i = period; i < values.length; i++){
      prev = values[i] * k + prev * (1 - k);
      out[i] = prev;
    }
    return out;
  }

  // RSI with Wilder's smoothing (same method most chart apps use)
  function rsiLast(closes, period = 14){
    if(closes.length <= period) return null;
    let gain = 0, loss = 0;
    for(let i = 1; i <= period; i++){
      const d = closes[i] - closes[i-1];
      if(d > 0) gain += d; else loss -= d;
    }
    let avgG = gain / period, avgL = loss / period;
    for(let i = period + 1; i < closes.length; i++){
      const d = closes[i] - closes[i-1];
      avgG = (avgG * (period - 1) + (d > 0 ? d : 0)) / period;
      avgL = (avgL * (period - 1) + (d < 0 ? -d : 0)) / period;
    }
    if(avgL === 0) return 100;
    return 100 - 100 / (1 + avgG / avgL);
  }

  // MACD(12, 26, 9)
  function macdLast(closes){
    const e12 = emaSeries(closes, 12), e26 = emaSeries(closes, 26);
    const macd = [];
    for(let i = 0; i < closes.length; i++){
      if(e12[i] !== null && e26[i] !== null) macd.push(e12[i] - e26[i]);
    }
    if(macd.length < 9) return null;
    const sig = emaSeries(macd, 9);
    return { macd: macd[macd.length - 1], signal: sig[sig.length - 1] };
  }

  function computeIndicators(daily){
    const closes = daily.map(b => b.close);
    const last = daily[daily.length - 1];
    const weekly = toWeekly(daily);
    const wCloses = weekly.map(w => w.close);
    const lastW = weekly[weekly.length - 1];
    const dm = macdLast(closes), wm = macdLast(wCloses);
    const ema = {};
    [20, 50, 100, 150, 200, 400].forEach(p => {
      const s = emaSeries(closes, p);
      ema[p] = s[s.length - 1];
    });
    return {
      asOf: last.date,
      daily: { rsi: rsiLast(closes), macd: dm ? dm.macd : null, signal: dm ? dm.signal : null,
               volume: isFinite(last.volume) ? last.volume : null },
      weekly: { rsi: rsiLast(wCloses), macd: wm ? wm.macd : null, signal: wm ? wm.signal : null,
                volume: lastW.hasVol ? lastW.volume : null },
      ema: ema,
      price: { open: last.open, high: last.high, low: last.low, close: last.close }
    };
  }

      row.appendChild(priceRow);
    }

    return row;
  }

  async function renderMain(){
    mainEl.innerHTML = '';

    if(!activePageId){
      const empty = document.createElement('div');
      empty.className = 'main-empty';
      empty.innerHTML = `<div class="big">No page open</div><div>Tap “+ New page” to start your journal.</div>`;
      mainEl.appendChild(empty);
      return;
    }

    const page = pages.find(p => p.id === activePageId);
    if(!page) return;

    const entries = await loadEntries(activePageId);

    const header = document.createElement('div');
    header.className = 'page-header';

    const titleWrap = document.createElement('div');
    titleWrap.className = 'page-title-wrap';
    const title = document.createElement('div');
    title.className = 'page-title';
    title.textContent = page.name;
    const meta = document.createElement('div');
    meta.className = 'page-meta';
    meta.textContent = `${entries.length} ${entries.length === 1 ? 'entry' : 'entries'}`;
    titleWrap.appendChild(title);
    titleWrap.appendChild(meta);

    const actions = document.createElement('div');
    actions.className = 'page-actions';
    const renameBtn = document.createElement('button');
    renameBtn.type = 'button';
    renameBtn.className = 'page-action';
    renameBtn.textContent = '✎ Rename';
    renameBtn.addEventListener('click', ()=> renamePage(page));
    const deleteBtn = document.createElement('button');
    deleteBtn.type = 'button';
    deleteBtn.className = 'page-action danger';
    deleteBtn.textContent = 'Delete';
    deleteBtn.addEventListener('click', ()=> deletePage(page));
    actions.appendChild(renameBtn);
    actions.appendChild(deleteBtn);

    header.appendChild(titleWrap);
    header.appendChild(actions);
    mainEl.appendChild(header);

    if(!formOpen){
      const addBtn = document.createElement('button');
      addBtn.className = 'add-stock-btn';
      addBtn.textContent = '+ Add stock';
      addBtn.addEventListener('click', async ()=>{
        formOpen = true;
        await renderAll();
        const nameInput = document.getElementById('newStockName');
        if(nameInput) nameInput.focus();
      });
      mainEl.appendChild(addBtn);
    } else {
      mainEl.appendChild(buildEntryForm(activePageId));
    }

    const ledger = document.createElement('div');
    ledger.className = 'ledger';
    if(entries.length === 0){
      const emptyLedger = document.createElement('div');
      emptyLedger.className = 'empty-ledger';
      emptyLedger.textContent = 'No stocks logged on this page yet.';
      ledger.appendChild(emptyLedger);
    } else {
      entries.forEach(entry => ledger.appendChild(buildStockRow(activePageId, entry)));
    }
    mainEl.appendChild(ledger);
  }

  async function renderAll(){
    await renderPagesList();
    await renderMain();
  }

  document.getElementById('addPageBtn').addEventListener('click', async ()=>{
    const p = { id: uid(), name: `Page ${pages.length + 1}`, createdAt: Date.now() };
    pages.push(p);
    await savePages();
    activePageId = p.id;
    formOpen = false;
    await renderAll();
  });

  async function generatePdf(){
    const btn = document.getElementById('pdfBtn');
    const originalLabel = btn.textContent;
    btn.textContent = 'Generating…';
    btn.disabled = true;
    try{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a4' });
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const marginX = 48;
      const maxY = pageHeight - 50;
      let y = 60;

      function ensureSpace(needed){
        if(y + needed > maxY){
          doc.addPage();
          y = 60;
        }
      }

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(20);
      doc.text('Ledger — Stock Journal', marginX, y);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(120);
      y += 16;
      doc.text('Exported ' + new Date().toLocaleString(), marginX, y);
      doc.setTextColor(0);
      y += 30;

      for(const page of pages){
        const entries = entriesCache[page.id] || (await loadEntries(page.id));

        ensureSpace(40);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(15);
        doc.text(page.name, marginX, y);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(120);
        doc.text(`${entries.length} ${entries.length === 1 ? 'entry' : 'entries'}`, pageWidth - marginX, y, { align: 'right' });
        doc.setTextColor(0);
        y += 10;
        doc.setDrawColor(200);
        doc.line(marginX, y, pageWidth - marginX, y);
        y += 22;

        if(entries.length === 0){
          doc.setFont('helvetica', 'italic');
          doc.setFontSize(10);
          doc.setTextColor(130);
          doc.text('No stocks logged on this page.', marginX, y);
          doc.setTextColor(0);
          y += 26;
        }

        for(const entry of entries){
          ensureSpace(95);

          doc.setFont('helvetica', 'bold');
          doc.setFontSize(12.5);
          doc.text(entry.name, marginX, y);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(8.5);
          doc.setTextColor(130);
          doc.text(fmtDate(entry.addedAt), pageWidth - marginX, y, { align: 'right' });
          doc.setTextColor(0);
          y += 16;

          doc.setFont('courier', 'normal');
          doc.setFontSize(9.5);
          const contentWidth = pageWidth - marginX - 8 - marginX;

          function printWrapped(text){
            const lines = doc.splitTextToSize(text, contentWidth);
            lines.forEach(line => {
              ensureSpace(13);
              doc.text(line, marginX + 8, y);
              y += 13;
            });
          }

          const d = entry.daily, w = entry.weekly;
          const fmt = v => (v === null || v === undefined) ? '—' : v;
          printWrapped(`Daily   RSI ${fmt(d.rsi)}   MACD ${fmt(d.macd)}   Signal ${fmt(d.signal)}   Vol ${fmtVolume(d.volume)}`);
          printWrapped(`Weekly  RSI ${fmt(w.rsi)}   MACD ${fmt(w.macd)}   Signal ${fmt(w.signal)}   Vol ${fmtVolume(w.volume)}`);

          const price = entry.price || {};
          const closePrice = price.close;

          const emaPeriods = [20, 50, 100, 150, 200, 400];
          const ema = entry.ema || {};
          const emaEntries = emaPeriods.filter(p => ema[p] !== null && ema[p] !== undefined);
          if(emaEntries.length){
            const emaStr = emaEntries.map(p => {
              const val = ema[p];
              let suffix = '';
              if(closePrice !== null && closePrice !== undefined){
                suffix = closePrice >= val ? ' (Above)' : ' (Below)';
              }
              return `EMA${p} ${val}${suffix}`;
            }).join('   ');
            printWrapped(emaStr);
          }

          const hasPrice = ['open','high','low','close'].some(k => price[k] !== null && price[k] !== undefined);
          if(hasPrice){
            printWrapped(`O ${fmt(price.open)}   H ${fmt(price.high)}   L ${fmt(price.low)}   C ${fmt(price.close)}`);
          }

          doc.setFont('helvetica', 'normal');
          y += 12;
        }

        y += 10;
      }

      doc.save(`stock-journal-${new Date().toISOString().slice(0,10)}.pdf`);
    }catch(e){
      console.error('PDF export failed', e);
      alert('Could not generate the PDF. Please try again.');
    }finally{
      btn.textContent = originalLabel;
      btn.disabled = false;
    }
  }

  document.getElementById('pdfBtn').addEventListener('click', generatePdf);

  async function init(){
    await loadPages();
    if(pages.length === 0){
      const p = { id: uid(), name: 'Page 1', createdAt: Date.now() };
      pages.push(p);
      await savePages();
    }
    activePageId = pages[0].id;
    // preload entries for all pages so counts show correctly
    for(const p of pages){
      await loadEntries(p.id);
    }
    await renderAll();
  }

  /* ---------- APP: INSTALL + OFFLINE ---------- */
  const installBtn = document.getElementById('installBtn');
  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredInstall = e;
    installBtn.style.display = 'block';
  });
  installBtn.addEventListener('click', async ()=>{
    if(!deferredInstall) return;
    deferredInstall.prompt();
    try{ await deferredInstall.userChoice; }catch(e){}
    deferredInstall = null;
    installBtn.style.display = 'none';
  });
  window.addEventListener('appinstalled', ()=>{ installBtn.style.display = 'none'; });

  if('serviceWorker' in navigator && location.protocol === 'https:'){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker not registered', err));
    });
  }
  // Ask the browser to keep this app's data even when the phone is low on space
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

  init();
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Stock Journal</title>
<meta name="theme-color" content="#08090a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #08090a;
    --panel: #131316;
    --panel-raised: #1b1b1f;
    --line: #2b2b30;
    --line-warm: #38383e;
    --paper: #f2f2f0;
    --muted: #8c8d93;
    --gold: #c9cbd2;
    --silver-hi: #f4f5f7;
    --silver-lo: #9a9ca3;
    --sage: #74ab8e;
    --rust: #c1654f;
    --app-h: 100vh;
  }
  @supports (height:100dvh){ :root{ --app-h: 100dvh; } }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 800px at 90% -10%, rgba(210,213,220,0.05), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(180,183,190,0.035), transparent 55%),
      var(--bg);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    display:grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: var(--app-h);
    height:var(--app-h);
    overflow:hidden;
  }

  /* ---------- SIDEBAR / LEDGER SPINE ---------- */
  .spine{
    background: linear-gradient(180deg, #131315, #08090a);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    height:var(--app-h);
    min-height:0;
    overflow:hidden;
  }
  .spine-head{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .v-logo{
    flex-shrink:0;
    width:36px;
    height:36px;
    border-radius:8px;
    background:linear-gradient(155deg, #1c1c1f, #000);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
  }
  .spine-head .mark{
    font-family:'Fraunces', serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:0.02em;
    line-height:1.15;
  }
  .spine-head .sub{
    margin-top:2px;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* ---------- NAV + LIBRARY TREE ---------- */
  .ic{ display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .nav{ display:flex; flex-direction:column; gap:2px; padding:12px 10px 8px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; width:100%;
    background:transparent; border:1px solid transparent; border-radius:7px;
    color:var(--muted); font-family:'Inter', sans-serif; font-size:13px; font-weight:500;
    padding:9px 12px; cursor:pointer; text-align:left;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .nav-item:hover{ color:var(--paper); background:var(--panel-raised); }
  .nav-item.active{ color:var(--paper); background:var(--panel-raised); border-color:var(--line); }
  .tree{ flex:1; min-height:0; overflow-y:auto; padding:4px 10px 20px; border-top:1px solid var(--line); }
  .tree-label{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); padding:14px 10px 6px; }
  .tree-item{
    display:flex; align-items:center; gap:8px; width:100%;
    background:transparent; border:none; border-radius:6px;
    color:var(--muted); font-family:'Inter', sans-serif; font-size:13px; text-align:left;
    padding:7px 10px; cursor:pointer;
  }
  .tree-item:hover{ background:var(--panel-raised); color:var(--paper); }
  .tree-item.active{ background:var(--panel-raised); color:var(--paper); box-shadow:inset 2px 0 0 var(--gold); }
  .tree-item .t-name{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tree-item .t-count{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--muted); }
  .tree-item .caret{ display:inline-flex; width:14px; opacity:.7; transition:transform .15s ease; }
  .tree-item .caret.open{ transform:rotate(90deg); }
  .tree-children{ padding-left:16px; }
  .tree-empty{ font-size:12px; color:var(--muted); padding:6px 10px; font-style:italic; opacity:.8; }

  /* ---------- MAIN ---------- */
  .main{
    height:var(--app-h);
    min-height:0;
    overflow-y:auto;
    padding:36px 48px 80px;
  }
  .main-empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:14px;
    text-align:center;
    flex-direction:column;
    gap:10px;
  }
  .main-empty .big{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:22px;
    color:var(--paper);
  }

  .crumbs{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .crumb{
    display:inline-flex; align-items:center; gap:4px;
    background:none; border:none; padding:4px 0; cursor:pointer;
    color:var(--muted); font-family:'Inter', sans-serif; font-size:12.5px;
  }
  .crumb:hover{ color:var(--paper); }
  .crumb-sep{ color:var(--line-warm); font-size:12px; }

  .page-header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px 16px;
    border-bottom:1px solid var(--line-warm);
    padding-bottom:16px;
    margin-bottom:26px;
  }
  .page-title-wrap{ min-width:0; flex:1 1 200px; }
  .page-title{
    font-family:'Fraunces', serif;
    font-size:30px;
    font-weight:600;
    line-height:1.15;
    overflow-wrap:anywhere;
  }
  .page-meta{
    margin-top:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:0.04em;
  }
  .page-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .page-action{
    display:inline-flex; align-items:center; gap:6px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:7px;
    padding:8px 12px;
    font-size:12px;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    white-space:nowrap;
  }
  .page-action:hover{ color:var(--paper); border-color:var(--paper); }
  .page-action.danger:hover{ color:var(--rust); border-color:var(--rust); }
  .page-action.primary{
    background:linear-gradient(135deg, var(--silver-hi), var(--gold) 55%, var(--silver-lo));
    color:#101012; border-color:transparent; font-weight:600;
  }
  .page-action.primary:hover{ filter:brightness(1.08); color:#101012; border-color:transparent; }
  .page-action.icon-only{ padding:8px 9px; }

  /* ---------- LIBRARY ---------- */
  .section-label{ font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
  .folder-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:12px; margin-bottom:32px; }
  .folder-card{
    position:relative; display:flex; flex-direction:column; gap:16px;
    padding:16px; border-radius:12px; border:1px solid var(--line);
    background:linear-gradient(160deg, #1a1a1e, #0d0d0f);
    cursor:pointer; color:var(--paper); min-width:0;
    transition:border-color .15s ease, transform .15s ease;
  }
  .folder-card:hover{ border-color:var(--silver-lo); }
  .folder-card:active{ transform:scale(0.985); }
  .folder-icon{
    width:36px; height:36px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel-raised); border:1px solid var(--line); color:var(--gold);
  }
  .f-name{ font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .f-meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); margin-top:4px; }
  .folder-card .more-btn{ position:absolute; top:10px; right:8px; }
  .more-btn{
    width:34px; height:34px; flex-shrink:0; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:var(--muted); cursor:pointer;
  }
  .more-btn:hover{ background:var(--panel-raised); color:var(--paper); }
  .journal-list{ border-top:1px solid var(--line); margin-bottom:32px; }
  .page-header + .journal-list{ border-top:none; margin-top:-10px; }
  .journal-row{
    display:flex; align-items:center; gap:14px;
    padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer;
    transition:background .15s ease;
  }
  .journal-row:hover{ background:rgba(255,255,255,0.018); }
  .j-icon{
    width:34px; height:34px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel); border:1px solid var(--line); color:var(--silver-lo);
  }
  .j-main{ flex:1; min-width:0; }
  .j-name{ font-family:'Fraunces', serif; font-size:16.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .j-meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); margin-top:3px; }
  .j-tickers{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--gold); margin-top:5px; letter-spacing:0.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty-card{
    display:block; width:100%; margin-bottom:32px;
    border:1px dashed var(--line); border-radius:12px; background:transparent;
    padding:22px 18px; text-align:center; color:var(--muted);
    font-family:'Inter', sans-serif; font-size:13px; line-height:1.55;
  }
  button.empty-card{ cursor:pointer; }
  button.empty-card:hover{ border-color:var(--silver-lo); color:var(--paper); }

  /* ---------- SHEETS (menus + dialogs) ---------- */
  .overlay{
    position:fixed; inset:0; z-index:60;
    display:flex; align-items:flex-end; justify-content:center;
    background:rgba(0,0,0,0.62);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    opacity:0; transition:opacity .18s ease;
  }
  .overlay.show{ opacity:1; }
  .overlay.closing{ pointer-events:none; }
  .sheet{
    width:100%; max-width:520px; max-height:82%; overflow-y:auto;
    background:linear-gradient(180deg, #18181b, #0f0f11);
    border:1px solid var(--line); border-bottom:none; border-radius:18px 18px 0 0;
    padding:10px 18px calc(20px + env(safe-area-inset-bottom, 0px));
    transform:translateY(28px); transition:transform .22s ease;
    box-shadow:0 -20px 60px rgba(0,0,0,0.5);
  }
  .overlay.show .sheet{ transform:translateY(0); }
  .sheet-grip{ width:38px; height:4px; border-radius:2px; background:var(--line-warm); margin:2px auto 16px; }
  .sheet-title{ font-family:'Fraunces', serif; font-size:19px; font-weight:600; line-height:1.25; overflow-wrap:anywhere; }
  .sheet-msg{ font-size:13px; color:var(--muted); line-height:1.5; margin-top:6px; }
  .sheet-input{
    width:100%; margin-top:14px;
    background:var(--bg); border:1px solid var(--line); border-radius:9px;
    color:var(--paper); font-family:'Inter', sans-serif; font-size:16px;
    padding:12px 13px; outline:none;
  }
  .sheet-input:focus{ border-color:var(--gold); }
  .sheet-actions{ display:flex; gap:10px; margin-top:18px; }
  .sheet-actions .btn{ flex:1; padding:12px 14px; font-size:13.5px; border-radius:9px; }
  .btn.danger{ background:rgba(193,101,79,0.14); color:var(--rust); border-color:rgba(193,101,79,0.5); font-weight:600; }
  .btn.danger:hover{ color:#e58a74; border-color:var(--rust); }
  .sheet-list{ display:flex; flex-direction:column; margin-top:10px; }
  .sheet-item{
    display:flex; align-items:center; gap:12px; width:100%;
    background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--paper); font-family:'Inter', sans-serif; font-size:14.5px; text-align:left;
    padding:14px 4px; cursor:pointer;
  }
  .sheet-item:last-child{ border-bottom:none; }
  .sheet-item .ic{ color:var(--silver-lo); }
  .sheet-item:hover .ic{ color:var(--paper); }
  .sheet-item.danger, .sheet-item.danger .ic{ color:var(--rust); }
  .sheet-item.current{ opacity:0.4; pointer-events:none; }
  .sheet-item .s-label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sheet-item .s-sub{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); flex-shrink:0; }
  .sheet-group{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); padding:16px 4px 2px; }
  #toast.ok{ border-color:var(--line-warm); }

  /* ---------- COMPARE ---------- */
  .cmp-slots{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:10px; align-items:center; margin-bottom:20px; }
  .cmp-slot{
    display:block; width:100%; min-width:0; text-align:left; cursor:pointer;
    padding:14px 15px; border-radius:12px; border:1px solid var(--line);
    background:linear-gradient(160deg, #1a1a1e, #0d0d0f);
    color:var(--paper); font-family:'Inter', sans-serif;
  }
  .cmp-slot:hover{ border-color:var(--silver-lo); }
  .cmp-slot .s-tag{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); font-weight:600; }
  .cmp-slot .s-name{ font-family:'Fraunces', serif; font-size:16.5px; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cmp-slot .s-meta{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--muted); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cmp-slot.empty .s-name{ color:var(--muted); font-style:italic; }
  .cmp-swap{
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel-raised); border:1px solid var(--line); color:var(--paper); cursor:pointer;
  }
  .cmp-swap:hover{ border-color:var(--silver-lo); }
  .cmp-summary{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .pill{ font-family:'IBM Plex Mono', monospace; font-size:11px; padding:6px 11px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--muted); }
  .pill b{ color:var(--paper); font-weight:600; }
  .pill.up b{ color:var(--sage); }
  .pill.down b{ color:var(--rust); }
  .seg{
    display:flex; gap:4px; padding:4px; margin-bottom:18px;
    border:1px solid var(--line); border-radius:11px; background:var(--panel);
    overflow-x:auto; scrollbar-width:none;
  }
  .seg::-webkit-scrollbar{ display:none; }
  .seg button{
    flex:1 0 auto; background:transparent; border:none; border-radius:8px;
    color:var(--muted); font-family:'Inter', sans-serif; font-size:12.5px; font-weight:500;
    padding:8px 12px; cursor:pointer; white-space:nowrap;
  }
  .seg button:hover{ color:var(--paper); }
  .seg button.on{ background:linear-gradient(135deg, var(--silver-hi), var(--gold) 55%, var(--silver-lo)); color:#101012; font-weight:600; }
  .cmp-card{ border:1px solid var(--line); border-radius:12px; background:var(--panel); margin-bottom:14px; overflow:hidden; }
  .cmp-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 16px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
  }
  .cmp-ticker{ font-family:'Fraunces', serif; font-size:18px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .cmp-close{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--muted); text-align:right; white-space:nowrap; }
  .cmp-close .chg{ display:block; font-size:12.5px; font-weight:600; margin-top:2px; }
  .up{ color:var(--sage); }
  .down{ color:var(--rust); }
  .flat{ color:var(--muted); }
  .cmp-scroll{ overflow-x:auto; }
  .cmp-table{ width:100%; border-collapse:collapse; font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .cmp-table th{
    font-family:'Inter', sans-serif; font-size:10px; font-weight:500;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--muted);
    text-align:right; padding:10px 16px 6px;
  }
  .cmp-table td{ text-align:right; padding:8px 16px; border-top:1px solid rgba(255,255,255,0.045); color:var(--paper); white-space:nowrap; vertical-align:top; }
  .cmp-table th:first-child, .cmp-table td:first-child{ text-align:left; color:var(--muted); }
  .cmp-table td.up{ color:var(--sage); }
  .cmp-table td.down{ color:var(--rust); }
  .cmp-table td.flat{ color:var(--muted); }
  .cmp-table .d-sub{ display:block; font-size:10px; opacity:0.85; margin-top:1px; }
  .cmp-table .st{ font-size:10px; margin-left:4px; }
  .cmp-table tr.flip td{ background:rgba(201,203,210,0.06); }
  .cmp-table tr.flip td:first-child{ color:var(--paper); }
  .sig-list{ display:flex; flex-direction:column; gap:10px; padding:14px 16px; }
  .sig{ display:flex; align-items:center; gap:10px; font-size:13px; line-height:1.4; }
  .sig .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .sig.bull .dot{ background:var(--sage); box-shadow:0 0 0 3px rgba(116,171,142,0.16); }
  .sig.bear .dot{ background:var(--rust); box-shadow:0 0 0 3px rgba(193,101,79,0.16); }
  .sig.warn .dot{ background:var(--gold); box-shadow:0 0 0 3px rgba(201,203,210,0.14); }
  .sig-none{ padding:14px 16px; color:var(--muted); font-size:12.5px; }
  .only-note{ font-size:12px; color:var(--muted); line-height:1.7; margin-top:6px; }
  .only-note b{ color:var(--paper); font-weight:500; font-family:'IBM Plex Mono', monospace; }

  #toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%, 20px);
    max-width:calc(100% - 32px);
    background:var(--panel-raised);
    border:1px solid var(--rust);
    color:var(--paper);
    font-size:12.5px;
    padding:10px 14px;
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:50;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  .head-actions{ display:flex; gap:8px; margin-top:16px; }
  .head-btn{
    flex:1;
    background:var(--panel-raised);
    border:1px solid var(--line);
    color:var(--paper);
    font-size:11px;
    padding:9px 6px;
    border-radius:3px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    white-space:nowrap;
  }
  .head-btn:hover{ border-color:var(--gold); }
  #installBtn{ display:none; }

  .add-stock-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    background:linear-gradient(135deg, var(--silver-hi), var(--gold) 55%, var(--silver-lo));
    color:#101012;
    font-weight:600;
    font-size:13px;
    border-radius:3px;
    cursor:pointer;
    border:none;
    letter-spacing:0.02em;
    margin-bottom:26px;
    transition:filter .15s ease;
  }
  .add-stock-btn:hover{ filter:brightness(1.08); }

  /* ---------- ENTRY FORM ---------- */
  .entry-form{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:22px 24px;
    margin-bottom:24px;
  }
  .entry-form .row1{
    margin-bottom:16px;
  }
  .entry-form input[type="text"]{
    width:100%;
    max-width:280px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--paper);
    font-family:'Fraunces', serif;
    font-size:19px;
    padding:6px 2px;
    outline:none;
  }
  .entry-form input[type="text"]:focus{ border-color:var(--gold); }
  .entry-form input[type="text"]::placeholder{ color:var(--muted); font-style:italic; }

  .name-row{ display:flex; align-items:center; gap:10px; }
  .name-row input[type="text"]{ flex:1; min-width:0; }
  .autofill-btn{
    flex-shrink:0;
    padding:9px 13px;
    border-radius:3px;
    border:1px solid var(--line);
    background:var(--panel-raised);
    color:var(--paper);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    white-space:nowrap;
  }

<script>
(function(){
  const PAGES_KEY = 'stock-journal-pages';          // journals (key kept so existing data loads)
  const FOLDERS_KEY = 'stock-journal-folders';
  const LAST_VIEW_KEY = 'stock-journal-last-view';
  const entriesKey = (pageId) => `stock-journal-entries:${pageId}`;
  const EMA_PERIODS = [20, 50, 100, 150, 200, 400];

  let pages = [];            // journals: { id, name, createdAt, folderId }
  let folders = [];          // { id, name, createdAt }
  let activePageId = null;
  let entriesCache = {};     // journalId -> entries (newest first)
  let formOpen = false;
  let view = { type:'library' };
  let compareTab = 'signals';
  let lastCompare = { a:null, b:null };
  const expandedFolders = new Set();

  const navEl = document.getElementById('nav');
  const treeEl = document.getElementById('tree');
  const mainEl = document.getElementById('main');

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  /* ---------- ON-DEVICE STORAGE ---------- */
  let saveWarned = false;
  function showToast(msg, kind){
    const t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.toggle('ok', kind === 'ok');
    t.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(()=> t.classList.remove('show'), 4000);
  }
  const store = {
    get(key){
      try{ return localStorage.getItem(key); }catch(e){ return null; }
    },
    set(key, value){
      try{ localStorage.setItem(key, value); return true; }
      catch(e){
        console.error('Save failed', e);
        if(!saveWarned){ saveWarned = true; showToast('Couldn\'t save on this device. Check that the browser allows site storage.'); }
        return false;
      }
    },
    del(key){
      try{ localStorage.removeItem(key); }catch(e){}
    }
  };

  async function loadPages(){
    try{
      const raw = store.get(PAGES_KEY);
      pages = raw ? JSON.parse(raw) : [];
    }catch(e){
      pages = [];
    }
  }

  async function savePages(){
    store.set(PAGES_KEY, JSON.stringify(pages));
  }

  async function loadEntries(pageId){
    if(entriesCache[pageId]) return entriesCache[pageId];
    try{
      const raw = store.get(entriesKey(pageId));
      const val = raw ? JSON.parse(raw) : [];
      entriesCache[pageId] = val;
      return val;
    }catch(e){
      entriesCache[pageId] = [];
      return [];
    }
  }

  async function saveEntries(pageId, entries){
    entriesCache[pageId] = entries;
    store.set(entriesKey(pageId), JSON.stringify(entries));
  }

  function fmtDate(ts){
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }

  function fmtVolume(v){
    if(v === null || v === undefined) return '—';
    if(v >= 1e9) return (v/1e9).toFixed(2).replace(/\.00$/,'') + 'B';
    if(v >= 1e6) return (v/1e6).toFixed(2).replace(/\.00$/,'') + 'M';
    if(v >= 1e3) return (v/1e3).toFixed(1).replace(/\.0$/,'') + 'K';
    return String(v);
  }

  function rsiClass(val){
    if(val === null || val === undefined || val === '') return 'neu';
    if(val >= 70) return 'neg';
    if(val <= 30) return 'pos';
    return 'neu';
  }

  function macdClass(macd, signal){
    if(macd === null || macd === undefined || macd === '' || signal === null || signal === undefined || signal === '') return 'neu';
    return macd >= signal ? 'pos' : 'neg';
  }

  function overallSignalColor(entry){
    // combine daily + weekly RSI extremes for a quick-glance dot
    const vals = [entry.daily.rsi, entry.weekly.rsi].filter(v => v !== null && v !== undefined && v !== '');
    if(vals.some(v => v >= 70)) return 'var(--rust)';
    if(vals.some(v => v <= 30)) return 'var(--sage)';
    return 'var(--muted)';
  }

  /* ---------- DOM HELPERS ---------- */
  const ICON = {
    library: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="4" height="16" rx="1"/><rect x="9" y="4" width="4" height="16" rx="1"/><path d="M15.5 5.2l3.4-.9 3 11.6-3.4.9z"/></svg>',
    compare: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3L4 7l4 4"/><path d="M4 7h13"/><path d="M16 21l4-4-4-4"/><path d="M20 17H7"/></svg>',
    folder: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>',
    journal: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3H18a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 1 4 18.5v-13A2.5 2.5 0 0 1 6.5 3z"/><path d="M8.5 8h6.5M8.5 12h6.5M8.5 16h4"/></svg>',
    more: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
    back: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    caret: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    plus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    edit: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
    move: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M9.5 13.5h6M13 11l2.5 2.5L13 16"/></svg>',
    trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>',
  };

  // Build DOM without innerHTML for anything the user typed
  function el(tag, props, ...kids){
    const n = document.createElement(tag);
    if(props){
      for(const [k, v] of Object.entries(props)){
        if(v === null || v === undefined || v === false) continue;
        if(k === 'class') n.className = v;
        else if(k === 'text') n.textContent = v;
        else if(k === 'html') n.innerHTML = v;              // static icon markup only
        else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v === true ? '' : v);
      }
    }
    for(const kid of kids.flat()){
      if(kid === null || kid === undefined || kid === false) continue;
      n.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    }
    return n;
  }
  function icon(name){ return el('span', { class:'ic', html: ICON[name] }); }
  function plural(n, one, many){ return `${n} ${n === 1 ? one : many}`; }
  function uniqueName(base, taken){
    const used = new Set(taken.map(s => s.toLowerCase()));
    if(!used.has(base.toLowerCase())) return base;
    let i = 2;
    while(used.has(`${base} (${i})`.toLowerCase())) i++;
    return `${base} (${i})`;
  }
  function slugify(s){ return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'journal'; }
  function activateOnEnter(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.currentTarget.click(); } }

  /* ---------- SHEETS: menus, prompts, confirmations ---------- */
  let closeOpenSheet = null;
  function openSheet(build){
    if(closeOpenSheet) closeOpenSheet(null);
    return new Promise(resolve => {
      const overlay = el('div', { class:'overlay' });
      const sheet = el('div', { class:'sheet', role:'dialog', 'aria-modal':'true' });
      let done = false;
      function close(value){
        if(done) return;
        done = true;
        closeOpenSheet = null;
        document.removeEventListener('keydown', onKey);
        overlay.classList.remove('show');
        overlay.classList.add('closing');          // fading sheets ignore taps
        setTimeout(()=> overlay.remove(), 200);
        resolve(value === undefined ? null : value);
      }
      function onKey(e){ if(e.key === 'Escape') close(null); }
      overlay.addEventListener('click', e => { if(e.target === overlay) close(null); });
      document.addEventListener('keydown', onKey);
      sheet.appendChild(el('div', { class:'sheet-grip' }));
      sheet.appendChild(build(close));
      overlay.appendChild(sheet);
      document.body.appendChild(overlay);
      closeOpenSheet = close;
      requestAnimationFrame(()=> overlay.classList.add('show'));
    });
  }

  function uiPrompt(title, value, opts = {}){
    return openSheet(close => {
      const input = el('input', { class:'sheet-input', type:'text', maxlength:'80', autocomplete:'off', placeholder: opts.placeholder || '' });
      input.value = value || '';
      input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); close(input.value.trim()); } });
      setTimeout(()=>{ try{ input.focus(); input.select(); }catch(e){} }, 80);
      return el('div', null,
        el('div', { class:'sheet-title', text:title }),
        opts.message ? el('div', { class:'sheet-msg', text:opts.message }) : null,
        input,
        el('div', { class:'sheet-actions' },
          el('button', { class:'btn', type:'button', text:'Cancel', onclick: ()=> close(null) }),
          el('button', { class:'btn primary', type:'button', 'data-role':'confirm', text: opts.confirm || 'Save', onclick: ()=> close(input.value.trim()) })));
    });
  }

  function uiConfirm(title, message, confirmLabel, danger = true){
    return openSheet(close => el('div', null,
      el('div', { class:'sheet-title', text:title }),
      message ? el('div', { class:'sheet-msg', text:message }) : null,
      el('div', { class:'sheet-actions' },
        el('button', { class:'btn', type:'button', text:'Cancel', onclick: ()=> close(false) }),
        el('button', { class:'btn ' + (danger ? 'danger' : 'primary'), type:'button', 'data-role':'confirm', text: confirmLabel || 'Delete', onclick: ()=> close(true) }))
    )).then(v => v === true);
  }

  /* ---------- NAVIGATION (hash routes, so the phone's back gesture works) ---------- */
  function viewToHash(v){
    if(v.type === 'journal') return '#/journal/' + v.id;
    if(v.type === 'folder') return '#/folder/' + v.id;
    if(v.type === 'compare'){
      const q = new URLSearchParams();
      if(v.a) q.set('a', v.a);
      if(v.b) q.set('b', v.b);
      const s = q.toString();
      return '#/compare' + (s ? '?' + s : '');
    }
    return '#/library';
  }
  function parseHash(hash){
    const m = /^#\/(library|journal|folder|compare)(?:\/([^?]+))?(?:\?(.*))?$/.exec(hash || '');
    if(!m) return null;
    if(m[1] === 'journal' || m[1] === 'folder') return m[2] ? { type:m[1], id: decodeURIComponent(m[2]) } : null;
    if(m[1] === 'compare'){ const q = new URLSearchParams(m[3] || ''); return { type:'compare', a:q.get('a'), b:q.get('b') }; }
    return { type:'library' };
  }
  function normalizeView(v){
    if(!v) return { type:'library' };
    if(v.type === 'journal' && !pageById(v.id)) return { type:'library' };
    if(v.type === 'folder' && !folderById(v.id)) return { type:'library' };
    if(v.type === 'compare') return { type:'compare', a: pageById(v.a) ? v.a : null, b: pageById(v.b) ? v.b : null };
    return v;
  }
  function go(v, replace){
    const target = viewToHash(v);
    if(replace || location.hash === target){
      history.replaceState(null, '', target);
      route();
    }else{
      location.hash = target;   // fires hashchange -> route()
    }
  }
  function route(){
    if(closeOpenSheet) closeOpenSheet(null);
    view = normalizeView(parseHash(location.hash));
    const canonical = viewToHash(view);
    if(canonical !== location.hash) history.replaceState(null, '', canonical);
    activePageId = view.type === 'journal' ? view.id : null;
    if(view.type === 'journal'){
      const p = pageById(view.id);
      if(p && p.folderId) expandedFolders.add(p.folderId);
    }
    if(view.type === 'folder') expandedFolders.add(view.id);
    formOpen = false;
    try{ localStorage.setItem(LAST_VIEW_KEY, canonical); }catch(e){}
    renderAll();
    mainEl.scrollTop = 0;
  }

  /* ---------- COMPARE ENGINE ---------- */
  function num(v){ return (typeof v === 'number' && isFinite(v)) ? v : null; }
  function latestByTicker(entries){
    const m = new Map();
    (entries || []).forEach(e => {                       // entries are stored newest first
      const k = (e.name || '').trim().toUpperCase();
      if(k && !m.has(k)) m.set(k, e);
    });
    return m;
  }
  function emaStatus(entry, p){
    const v = entry.ema ? entry.ema[p] : null;
    if(v === 'above' || v === 'below') return v;           // entries from the old Above/Below version
    const e = num(v), c = num(entry.price && entry.price.close);
    if(e === null || c === null) return null;
    return c >= e ? 'above' : 'below';
  }
  function crossDir(a1, b1, a2, b2){                       // did (a - b) change sign from 1 to 2?
    if([a1, b1, a2, b2].some(v => v === null)) return 0;
    const s1 = Math.sign(a1 - b1), s2 = Math.sign(a2 - b2);
    if(s1 <= 0 && s2 > 0) return 1;
    if(s1 >= 0 && s2 < 0) return -1;
    return 0;
  }
  function detectSignals(a, b){
    const out = [];
    [['Daily', 'daily'], ['Weekly', 'weekly']].forEach(([label, k]) => {
      const A = a[k] || {}, B = b[k] || {};
      const c = crossDir(num(A.macd), num(A.signal), num(B.macd), num(B.signal));
      if(c) out.push({ dir: c > 0 ? 'bull' : 'bear', text: `${label} MACD crossed ${c > 0 ? 'above' : 'below'} its signal line` });
      const z = crossDir(num(A.macd), 0, num(B.macd), 0);
      if(z) out.push({ dir: z > 0 ? 'bull' : 'bear', text: `${label} MACD crossed ${z > 0 ? 'above' : 'below'} zero` });
      [30, 50, 70].forEach(lv => {
        const r = crossDir(num(A.rsi), lv, num(B.rsi), lv);
        if(!r) return;
        let dir = r > 0 ? 'bull' : 'bear', note = '';
        if(r > 0 && lv === 70){ dir = 'warn'; note = ' — overbought'; }
        if(r < 0 && lv === 30){ dir = 'warn'; note = ' — oversold'; }
        if(r > 0 && lv === 30) note = ' — out of oversold';
        if(r < 0 && lv === 70) note = ' — out of overbought';
        out.push({ dir, text: `${label} RSI crossed ${r > 0 ? 'above' : 'below'} ${lv}${note}` });
      });
    });
    EMA_PERIODS.forEach(p => {
      const sa = emaStatus(a, p), sb = emaStatus(b, p);
      if(sa && sb && sa !== sb) out.push({ dir: sb === 'above' ? 'bull' : 'bear', text: `Price moved ${sb} EMA ${p}` });
    });
    return out;
  }
  function fmtVal(v, kind){
    const n = num(v);
    if(n === null) return '—';
    if(kind === 'vol') return fmtVolume(n);
    return n.toFixed(kind === 'macd' ? 3 : 2);
  }
  function signed(n, dec){ return (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n).toFixed(dec); }
  function deltaCell(a, b, kind){
    const x = num(a), y = num(b);
    if(x === null || y === null) return el('td', { class:'flat', text:'—' });
    const d = y - x;
    const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
    const pct = x !== 0 ? d / Math.abs(x) * 100 : null;
    if(kind === 'vol') return el('td', { class:cls, text: pct === null ? '—' : signed(pct, 1) + '%' });
    if(kind === 'price') return el('td', { class:cls }, signed(d, 2), pct === null ? null : el('span', { class:'d-sub', text: signed(pct, 2) + '%' }));
    return el('td', { class:cls, text: signed(d, kind === 'macd' ? 3 : 2) });
  }
  function cmpTable(rows){
    const body = el('tbody', null, rows.map(r => el('tr', { class: r.flip ? 'flip' : null },
      el('td', { text:r.label }),
      el('td', null, fmtVal(r.a, r.kind), r.aNote ? el('span', { class:'st ' + r.aNote.cls, text:r.aNote.t }) : null),
      el('td', null, fmtVal(r.b, r.kind), r.bNote ? el('span', { class:'st ' + r.bNote.cls, text:r.bNote.t }) : null),
      deltaCell(r.a, r.b, r.kind))));
    return el('div', { class:'cmp-scroll' }, el('table', { class:'cmp-table' },
      el('thead', null, el('tr', null, el('th', { text:'' }), el('th', { text:'A' }), el('th', { text:'B' }), el('th', { text:'Change' }))), body));
  }
  function cmpCard(r){
    const ca = num(r.a.price && r.a.price.close), cb = num(r.b.price && r.b.price.close);
    let closeInfo;
    if(ca !== null && cb !== null){
      const d = cb - ca, pct = ca !== 0 ? d / Math.abs(ca) * 100 : 0;
      closeInfo = el('div', { class:'cmp-close' }, `Close ${ca.toFixed(2)} → ${cb.toFixed(2)}`,
        el('span', { class:'chg ' + (d > 0 ? 'up' : d < 0 ? 'down' : 'flat'), text: signed(pct, 2) + '%' }));
    }else closeInfo = el('div', { class:'cmp-close', text:'Close —' });
    const card = el('div', { class:'cmp-card', 'data-ticker': r.t }, el('div', { class:'cmp-head' }, el('div', { class:'cmp-ticker', text:r.t }), closeInfo));
    const A = r.a, B = r.b;
    if(compareTab === 'signals'){
      card.appendChild(r.sigs.length
        ? el('div', { class:'sig-list' }, r.sigs.map(s => el('div', { class:'sig ' + s.dir }, el('span', { class:'dot' }), el('span', { text:s.text }))))
        : el('div', { class:'sig-none', text:'No signal changes between these journals.' }));
    }else if(compareTab === 'daily' || compareTab === 'weekly'){
      const a = A[compareTab] || {}, b = B[compareTab] || {};
      card.appendChild(cmpTable([
        { label:'RSI (14)', a:a.rsi, b:b.rsi, kind:'rsi' },
        { label:'MACD', a:a.macd, b:b.macd, kind:'macd' },
        { label:'Signal', a:a.signal, b:b.signal, kind:'macd' },
        { label:'Volume', a:a.volume, b:b.volume, kind:'vol' },
      ]));
    }else if(compareTab === 'ema'){
      const note = s => s ? { t: s === 'above' ? '▲' : '▼', cls: s === 'above' ? 'up' : 'down' } : null;
      card.appendChild(cmpTable(EMA_PERIODS.map(p => {
        const sa = emaStatus(A, p), sb = emaStatus(B, p);
        return { label:'EMA ' + p, a: A.ema ? A.ema[p] : null, b: B.ema ? B.ema[p] : null, kind:'price', aNote: note(sa), bNote: note(sb), flip: !!(sa && sb && sa !== sb) };
      })));
    }else{
      const a = A.price || {}, b = B.price || {};
      card.appendChild(cmpTable([
        { label:'Open', a:a.open, b:b.open, kind:'price' },
        { label:'High', a:a.high, b:b.high, kind:'price' },
        { label:'Low', a:a.low, b:b.low, kind:'price' },
        { label:'Close', a:a.close, b:b.close, kind:'price' },
      ]));
    }
    return card;
  }

  /* ---------- AUTO-FILL: DATA ---------- */
  async function fetchDailyBars(symbol, apiKey){
    const url = 'https://api.twelvedata.com/time_series'
      + '?symbol=' + encodeURIComponent(symbol)
      + '&interval=1day&outputsize=2500'
      + '&apikey=' + encodeURIComponent(apiKey);
    let data;
    try{
      const res = await fetch(url);
      data = await res.json();
    }catch(e){
      throw new Error('Couldn\'t reach the data service. Check your internet connection.');
    }
    if(!data || data.status === 'error' || !Array.isArray(data.values)){
      const msg = (data && data.message) ? data.message : 'No data returned for this ticker.';
      throw new Error(msg.length > 180 ? msg.slice(0, 180) + '…' : msg);
    }
    const bars = data.values.map(v => ({
      date: String(v.datetime).slice(0, 10),
      open: parseFloat(v.open),
      high: parseFloat(v.high),
      low: parseFloat(v.low),
      close: parseFloat(v.close),
      volume: v.volume !== undefined ? parseFloat(v.volume) : NaN
    })).filter(b => isFinite(b.close));
    bars.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    if(!bars.length) throw new Error('No price data returned for this ticker.');
    return bars;
  }

  function weekKey(dateStr){
    const d = new Date(dateStr + 'T00:00:00Z');
    const dow = (d.getUTCDay() + 6) % 7; // Monday = 0
    d.setUTCDate(d.getUTCDate() - dow);
    return d.toISOString().slice(0, 10);
  }

  function toWeekly(daily){
    const weeks = [];
    let cur = null;
    for(const b of daily){
      const k = weekKey(b.date);
      if(!cur || cur.key !== k){
        cur = { key:k, open:b.open, high:b.high, low:b.low, close:b.close,
                volume: isFinite(b.volume) ? b.volume : 0, hasVol: isFinite(b.volume) };
        weeks.push(cur);
      }else{
        cur.high = Math.max(cur.high, b.high);
        cur.low = Math.min(cur.low, b.low);
        cur.close = b.close;
        if(isFinite(b.volume)){ cur.volume += b.volume; cur.hasVol = true; }
      }
    }
    return weeks;
  }

  // EMA seeded with the simple average of the first `period` values
  function emaSeries(values, period){
    const out = new Array(values.length).fill(null);
    if(values.length < period) return out;
    let sum = 0;
    for(let i = 0; i < period; i++) sum += values[i];
    let prev = sum / period;
    out[period - 1] = prev;
    const k = 2 / (period + 1);
    for(let i = period; i < values.length; i++){
      prev = values[i] * k + prev * (1 - k);
      out[i] = prev;
    }
    return out;
  }

  // RSI with Wilder's smoothing (same method most chart apps use)
  function rsiLast(closes, period = 14){
    if(closes.length <= period) return null;
    let gain = 0, loss = 0;
    for(let i = 1; i <= period; i++){
      const d = closes[i] - closes[i-1];
      if(d > 0) gain += d; else loss -= d;
    }
    let avgG = gain / period, avgL = loss / period;
    for(let i = period + 1; i < closes.length; i++){
      const d = closes[i] - closes[i-1];
      avgG = (avgG * (period - 1) + (d > 0 ? d : 0)) / period;
      avgL = (avgL * (period - 1) + (d < 0 ? -d : 0)) / period;
    }
    if(avgL === 0) return 100;
    return 100 - 100 / (1 + avgG / avgL);
  }

  // MACD(12, 26, 9)
  function macdLast(closes){
    const e12 = emaSeries(closes, 12), e26 = emaSeries(closes, 26);
    const macd = [];
    for(let i = 0; i < closes.length; i++){
      if(e12[i] !== null && e26[i] !== null) macd.push(e12[i] - e26[i]);
    }
    if(macd.length < 9) return null;
    const sig = emaSeries(macd, 9);
    return { macd: macd[macd.length - 1], signal: sig[sig.length - 1] };
  }

  function computeIndicators(daily){
    const closes = daily.map(b => b.close);
    const last = daily[daily.length - 1];
    const weekly = toWeekly(daily);
    const wCloses = weekly.map(w => w.close);
    const lastW = weekly[weekly.length - 1];
    const dm = macdLast(closes), wm = macdLast(wCloses);
    const ema = {};
    [20, 50, 100, 150, 200, 400].forEach(p => {
      const s = emaSeries(closes, p);
      ema[p] = s[s.length - 1];
    });
    return {
      asOf: last.date,
      daily: { rsi: rsiLast(closes), macd: dm ? dm.macd : null, signal: dm ? dm.signal : null,
               volume: isFinite(last.volume) ? last.volume : null },
      weekly: { rsi: rsiLast(wCloses), macd: wm ? wm.macd : null, signal: wm ? wm.signal : null,
                volume: lastW.hasVol ? lastW.volume : null },
      ema: ema,
      price: { open: last.open, high: last.high, low: last.low, close: last.close }
    };
  }

  function renderCompare(){
    lastCompare = { a:view.a, b:view.b };
    const A = view.a ? pageById(view.a) : null, B = view.b ? pageById(view.b) : null;
    mainEl.appendChild(headerBlock('Compare', A && B ? 'What changed from journal A to journal B' : 'Pick two journals to line them up side by side', []));

    const slot = (tag, p, other, key) => {
      const f = p && p.folderId ? folderById(p.folderId) : null;
      return el('button', { class:'cmp-slot' + (p ? '' : ' empty'), type:'button', 'data-slot': key, onclick: async ()=>{
          const id = await uiPickJournal(`Choose journal ${tag}`, other ? other.id : null);
          if(!id) return;
          const next = { type:'compare', a:view.a, b:view.b };
          next[key] = id;
          go(next, true);
        }},
        el('div', { class:'s-tag', text:'Journal ' + tag }),
        el('div', { class:'s-name', text: p ? p.name : 'Tap to choose' }),
        el('div', { class:'s-meta', text: p ? `${f ? f.name : 'Library'} · ${plural(entryCount(p.id), 'stock', 'stocks')}` : 'from your library' }));
    };
    const swap = el('button', { class:'cmp-swap', type:'button', 'aria-label':'Swap A and B', html: ICON.compare, onclick: ()=> go({ type:'compare', a:view.b, b:view.a }, true) });
    mainEl.appendChild(el('div', { class:'cmp-slots' }, slot('A', A, B, 'a'), swap, slot('B', B, A, 'b')));

    if(!A || !B){
      mainEl.appendChild(el('div', { class:'empty-card', text:'Choose two journals — for example yesterday’s and today’s. Ledger lines up the same tickers side by side and highlights every change and signal flip.' }));
      return;
    }
    const ma = latestByTicker(entriesCache[A.id]), mb = latestByTicker(entriesCache[B.id]);
    const both = [...ma.keys()].filter(k => mb.has(k)).sort();
    const onlyA = [...ma.keys()].filter(k => !mb.has(k)).sort();
    const onlyB = [...mb.keys()].filter(k => !ma.has(k)).sort();
    const results = both.map(t => ({ t, a: ma.get(t), b: mb.get(t), sigs: detectSignals(ma.get(t), mb.get(t)) }));
    const count = dir => results.reduce((s, r) => s + r.sigs.filter(x => !dir || x.dir === dir).length, 0);
    const pill = (cls, n, label) => el('span', { class:'pill' + (cls ? ' ' + cls : '') }, el('b', { text:String(n) }), ' ' + label);
    mainEl.appendChild(el('div', { class:'cmp-summary' },
      pill('', both.length, both.length === 1 ? 'matching ticker' : 'matching tickers'),
      pill('', count(), count() === 1 ? 'signal change' : 'signal changes'),
      count('bull') ? pill('up', count('bull'), 'bullish') : null,
      count('bear') ? pill('down', count('bear'), 'bearish') : null));

    if(!both.length){
      mainEl.appendChild(el('div', { class:'empty-card', text:'These two journals have no tickers in common.' }));
    }else{
      const tabs = [['signals', 'Signals'], ['daily', 'Daily'], ['weekly', 'Weekly'], ['ema', 'EMAs'], ['price', 'Price']];
      mainEl.appendChild(el('div', { class:'seg', role:'tablist' }, tabs.map(([k, label]) =>
        el('button', { class: compareTab === k ? 'on' : null, type:'button', role:'tab', 'data-tab': k, 'aria-selected': compareTab === k ? 'true' : 'false', text: label,
          onclick: ()=>{ const st = mainEl.scrollTop; compareTab = k; renderMain().then(()=>{ mainEl.scrollTop = st; }); } }))));
      results.forEach(r => mainEl.appendChild(cmpCard(r)));
    }
    if(onlyA.length || onlyB.length){
      mainEl.appendChild(el('div', { class:'only-note' },
        onlyA.length ? el('div', null, 'Only in A: ', el('b', { text: onlyA.join(', ') })) : null,
        onlyB.length ? el('div', null, 'Only in B: ', el('b', { text: onlyB.join(', ') })) : null));
    }
  }

  async function renderMain(){
    mainEl.replaceChildren();
    if(view.type === 'journal'){ const p = pageById(view.id); if(p) return renderJournal(p); }
    if(view.type === 'folder'){ const f = folderById(view.id); if(f) return renderFolder(f); }
    if(view.type === 'compare') return renderCompare();
    return renderLibrary();
  }

  async function renderAll(){
    renderSidebar();
    await renderMain();
  }

  async function generatePdf(){
    const btn = document.getElementById('pdfBtn');
    const originalLabel = btn.textContent;
    btn.textContent = 'Generating…';
    btn.disabled = true;
    try{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a4' });
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const marginX = 48;
      const maxY = pageHeight - 50;
      let y = 60;

      function ensureSpace(needed){
        if(y + needed > maxY){
          doc.addPage();
          y = 60;
        }
      }

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(20);
      const scope = pdfScope();
      doc.text(doc.splitTextToSize('Ledger — ' + scope.label, pageWidth - marginX * 2)[0], marginX, y);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(120);
      y += 16;
      doc.text('Exported ' + new Date().toLocaleString(), marginX, y);
      doc.setTextColor(0);
      y += 30;

      for(const group of scope.groups){
        if(!group.pages.length) continue;
        if(group.title){
          ensureSpace(70);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(10.5);
          doc.setTextColor(110);
          doc.text(group.title.toUpperCase(), marginX, y);
          doc.setTextColor(0);
          y += 24;
        }
      for(const page of group.pages){
        const entries = entriesCache[page.id] || (await loadEntries(page.id));

        ensureSpace(40);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(15);
        doc.text(page.name, marginX, y);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(120);
        doc.text(`${entries.length} ${entries.length === 1 ? 'entry' : 'entries'}`, pageWidth - marginX, y, { align: 'right' });
        doc.setTextColor(0);
        y += 10;
        doc.setDrawColor(200);
        doc.line(marginX, y, pageWidth - marginX, y);
        y += 22;

        if(entries.length === 0){
          doc.setFont('helvetica', 'italic');
          doc.setFontSize(10);
          doc.setTextColor(130);
          doc.text('No stocks logged in this journal.', marginX, y);
          doc.setTextColor(0);
          y += 26;
        }

        for(const entry of entries){
          ensureSpace(95);

          doc.setFont('helvetica', 'bold');
          doc.setFontSize(12.5);
          doc.text(entry.name, marginX, y);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(8.5);
          doc.setTextColor(130);
          doc.text(fmtDate(entry.addedAt), pageWidth - marginX, y, { align: 'right' });
          doc.setTextColor(0);
          y += 16;

          doc.setFont('courier', 'normal');
          doc.setFontSize(9.5);
          const contentWidth = pageWidth - marginX - 8 - marginX;

          function printWrapped(text){
            const lines = doc.splitTextToSize(text, contentWidth);
            lines.forEach(line => {
              ensureSpace(13);
              doc.text(line, marginX + 8, y);
              y += 13;
            });
          }

          const d = entry.daily, w = entry.weekly;
          const fmt = v => (v === null || v === undefined) ? '—' : v;
          printWrapped(`Daily   RSI ${fmt(d.rsi)}   MACD ${fmt(d.macd)}   Signal ${fmt(d.signal)}   Vol ${fmtVolume(d.volume)}`);
          printWrapped(`Weekly  RSI ${fmt(w.rsi)}   MACD ${fmt(w.macd)}   Signal ${fmt(w.signal)}   Vol ${fmtVolume(w.volume)}`);

          const price = entry.price || {};
          const closePrice = price.close;

          const emaPeriods = [20, 50, 100, 150, 200, 400];
          const ema = entry.ema || {};
          const emaEntries = emaPeriods.filter(p => ema[p] !== null && ema[p] !== undefined);
          if(emaEntries.length){
            const emaStr = emaEntries.map(p => {
              const val = ema[p];
              let suffix = '';
              if(closePrice !== null && closePrice !== undefined){
                suffix = closePrice >= val ? ' (Above)' : ' (Below)';
              }
              return `EMA${p} ${val}${suffix}`;
            }).join('   ');
            printWrapped(emaStr);
          }

          const hasPrice = ['open','high','low','close'].some(k => price[k] !== null && price[k] !== undefined);
          if(hasPrice){
            printWrapped(`O ${fmt(price.open)}   H ${fmt(price.high)}   L ${fmt(price.low)}   C ${fmt(price.close)}`);
          }

          doc.setFont('helvetica', 'normal');
          y += 12;
        }

        y += 10;
      }
      }

      doc.save(`ledger-${slugify(scope.label)}-${new Date().toISOString().slice(0,10)}.pdf`);
    }catch(e){
      console.error('PDF export failed', e);
      alert('Could not generate the PDF. Please try again.');
    }finally{
      btn.textContent = originalLabel;
      btn.disabled = false;
    }
  }

  document.getElementById('pdfBtn').addEventListener('click', generatePdf);

  async function init(){
    await loadPages();
    loadFolders();
    let changed = false;
    pages.forEach(p => {
      if(p.folderId && !folderById(p.folderId)){ p.folderId = null; changed = true; }
      if(!p.createdAt){ p.createdAt = Date.now(); changed = true; }
    });
    if(pages.length === 0){
      pages.push({ id: uid(), name: fmtDate(Date.now()), createdAt: Date.now(), folderId: null });
      changed = true;
    }
    if(changed) await savePages();
    for(const p of pages){ await loadEntries(p.id); }

    // Reopen where you left off (or the Library on first run)
    let start = location.hash;
    if(!parseHash(start)){
      try{ start = localStorage.getItem(LAST_VIEW_KEY) || ''; }catch(e){ start = ''; }
    }
    history.replaceState(null, '', parseHash(start) ? start : '#/library');
    window.addEventListener('hashchange', route);
    route();
  }

  /* ---------- APP: INSTALL + OFFLINE ---------- */
  const installBtn = document.getElementById('installBtn');
  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredInstall = e;
    installBtn.style.display = 'block';
  });
  installBtn.addEventListener('click', async ()=>{
    if(!deferredInstall) return;
    deferredInstall.prompt();
    try{ await deferredInstall.userChoice; }catch(e){}
    deferredInstall = null;
    installBtn.style.display = 'none';
  });
  window.addEventListener('appinstalled', ()=>{ installBtn.style.display = 'none'; });

  if('serviceWorker' in navigator && location.protocol === 'https:'){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker not registered', err));
    });
  }
  // Ask the browser to keep this app's data even when the phone is low on space
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

  init();
})();
</script>
